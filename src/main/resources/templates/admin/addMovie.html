<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add New Movie - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin/universal.css}">

    <link rel="stylesheet" th:href="@{/css/admin/addMovie.css}">
</head>
<body class="bg-light">

<div th:replace="~{admin/fragments/navbar :: admin-nav}"></div>

<div class="container mb-5 mt-4">
    <div class="row justify-content-center">
        <div class="col-xl-11">

            <div id="apiSection" class="tmdb-search-box">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h3 class="fw-bold mb-1" style="color: #1e293b;"><i class="fa-solid fa-satellite-dish text-info me-2"></i> Movie Database Explorer</h3>
                        <p class="text-muted mb-0">Search and fetch movie data instantly from global TMDB network.</p>
                    </div>
                    <span class="badge bg-info-subtle text-info px-3 py-2 rounded-pill border border-info fw-bold">
                        <i class="fa-solid fa-wifi me-1"></i> Discover movies from TMDB
                    </span>
                </div>

                <div class="input-group mb-4">
                    <span class="input-group-text bg-white border-end-0" style="border-radius: 12px 0 0 12px; border: 2px solid #cbd5e1; border-right: none;">
                        <i class="fa-solid fa-magnifying-glass text-muted fs-5"></i>
                    </span>
                    <input type="text" id="apiSearchInput" class="form-control search-tmdb-input border-start-0" style="border-radius: 0 12px 12px 0;" placeholder="Enter movie title (e.g., Avengers, Inception, Titanic)...">
                </div>

                <div id="apiLoading" class="text-center d-none my-5">
                    <div class="spinner-border text-info" style="width: 3rem; height: 3rem;" role="status"></div>
                    <h5 class="mt-3 text-muted fw-bold">Scanning database...</h5>
                </div>

                <div id="apiResults" class="row g-4"></div>

                <div class="text-center mt-5 pt-4 border-top">
                    <p class="text-muted small fw-bold mb-3">Can't find the movie you are looking for?</p>
                    <button class="btn btn-light border shadow-sm rounded-pill px-4 fw-bold text-secondary" onclick="openBlankForm()">
                        <i class="fa-solid fa-pen-to-square me-2"></i> Enter Data Manually
                    </button>
                </div>
            </div>

            <form id="addMovieForm" class="d-none setup-form-card">

                <div class="tech-form-header">
                    <h4 class="m-0"><i class="fa-solid fa-film text-success me-2"></i> Movie Configuration</h4>
                    <button type="button" class="btn btn-light border shadow-sm fw-bold" onclick="backToSearch()">
                        <i class="fa-solid fa-arrow-left text-danger me-1"></i> Back to Add Movie
                    </button>
                </div>

                <input type="hidden" id="posterUrl" name="posterUrl">
                <input type="hidden" id="bannerUrl" name="bannerUrl">
                <input type="hidden" id="genres" name="genres">
                <input type="hidden" id="movieTrailerUrl" name="trailerUrl">

                <div class="row g-4 mb-4">
                    <div class="col-lg-8">
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label-tech">Movie Title <span class="text-danger">*</span></label>
                                <input type="text" class="form-control input-tech" id="movieTitle" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label-tech">Duration (Mins) <span class="text-danger">*</span></label>
                                <input type="number" class="form-control input-tech" id="movieDuration" required min="1">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label-tech">Release Date <span class="text-danger">*</span></label>
                                <input type="date" class="form-control input-tech" id="movieReleaseDate" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label-tech">Language</label>
                                <input type="text" class="form-control input-tech" id="movieLanguage" required>
                            </div>
                            <div class="col-12 mt-3">
                                <label class="form-label-tech">Synopsis / Description <span class="text-danger">*</span></label>
                                <textarea class="form-control input-tech" id="movieDesc" rows="4" required></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-4">
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label-tech">System Status <span class="text-danger">*</span></label>
                                <select class="form-select input-tech" id="movieStatus" required>
                                    <option value="Coming Soon">Coming Soon</option>
                                    <option value="Now Playing">Now Playing</option>
                                    <option value="Pending">Pending</option>
                                    <option value="Disabled">Disabled</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label-tech">Director</label>
                                <input type="text" class="form-control input-tech" id="movieDirector" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label-tech">Cast / Actors</label>
                                <input type="text" class="form-control input-tech" id="movieActors" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label-tech">TMDB Rating (0-10)</label>
                                <input type="number" step="0.1" class="form-control input-tech" id="movieRating" required min="0" max="10">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row mt-4 p-4 bg-light border rounded-4 shadow-sm mx-0">
                    <div class="col-md-6 mb-3 mb-md-0">
                        <label class="form-label-tech text-success"><i class="fa-solid fa-layer-group"></i> Local Categories <span class="text-danger">*</span></label>
                        <div class="d-flex gap-2">
                            <select class="form-select input-tech" id="movieCategorySelect">
                                <option value="" selected disabled>-- Select a category to tag --</option>
                            </select>
                            <button type="button" class="btn btn-success fw-bold px-4 rounded-3" onclick="addCategoryTag()"><i class="fa-solid fa-plus"></i></button>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label-tech">Selected Tags:</label>
                        <div id="selectedCategoryTags" class="d-flex flex-wrap gap-2 p-3 border rounded-3 bg-white" style="min-height: 52px;">
                            <span class="text-muted small align-self-center">No categories selected yet.</span>
                        </div>
                    </div>
                </div>

                <h5 class="fw-bold text-dark mt-5 mb-4 border-start border-success border-4 ps-2">Media & Visual Assets</h5>
                <div class="row g-4 mb-4">

                    <div class="col-md-4">
                        <div class="media-upload-card">
                            <label class="form-label-tech text-primary"><i class="fa-solid fa-image"></i> Banner (Horizontal)</label>
                            <input class="form-control input-tech mb-2" type="file" id="movieBanner" accept="image/*">
                            <div id="bannerPreviewContainer" class="mt-3 d-none text-center bg-white p-2 rounded border shadow-sm">
                                <p class="small text-success fw-bold mb-1"><i class="fa-solid fa-check-circle"></i> Banner Ready</p>
                                <img id="bannerPreview" src="" alt="Banner" style="width: 100%; height: 100px; border-radius: 8px; object-fit: cover;">
                            </div>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="media-upload-card">
                            <label class="form-label-tech text-primary"><i class="fa-solid fa-image"></i> Poster (Vertical)</label>
                            <input class="form-control input-tech mb-2" type="file" id="moviePosterFile" accept="image/*">
                            <div id="posterPreviewContainer" class="mt-3 d-none text-center bg-white p-2 rounded border shadow-sm">
                                <p class="small text-success fw-bold mb-1"><i class="fa-solid fa-check-circle"></i> Poster Ready</p>
                                <img id="posterPreview" src="" alt="Poster" style="height: 150px; border-radius: 8px; object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
                            </div>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="media-upload-card">
                            <label class="form-label-tech text-danger"><i class="fa-brands fa-youtube"></i> Trailer Video</label>
                            <input class="form-control input-tech mb-2" type="file" id="movieTrailer" accept="video/mp4">
                            <div id="trailerPreviewContainer" class="mt-3 d-none text-center bg-dark p-1 rounded border shadow-sm">
                                <iframe id="trailerPreview" src="" style="width: 100%; height: 135px; border-radius: 8px;" frameborder="0" allowfullscreen></iframe>
                            </div>
                        </div>
                    </div>

                </div>

                <div id="formValidationError" class="text-danger fw-bold mt-4 text-end" style="display: none;"></div>

                <div class="d-grid gap-3 d-md-flex justify-content-md-end mt-3 pt-4 border-top">
                    <a href="/admin/movies/search" class="btn btn-light border px-4 fw-bold text-muted tech-btn">Cancel</a>
                    <button type="submit" class="btn tech-btn tech-btn-success" id="btnSubmitMovie">
                        <i class="fa-solid fa-cloud-arrow-up me-2"></i> Save Movie to Database
                    </button>
                </div>

            </form>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin/admin-auth.js}"></script>

<script th:src="@{/js/admin/addMovie.js}"></script>
</body>
</html>

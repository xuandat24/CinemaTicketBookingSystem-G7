<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add New Movie - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin/universal.css}">
    <link rel="stylesheet" th:href="@{/css/admin/addMovie.css}">
</head>
<body class="bg-light">

<div th:replace="~{admin/fragments/navbar :: admin-nav}"></div>

<div class="container mb-5 mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-success text-white py-3">
                    <h4 class="mb-0"><i class="fa-solid fa-film me-2"></i> Add New Movie</h4>
                </div>
                <div class="card-body p-4">

                    <div id="apiSection">
                        <div class="input-group mb-4 shadow-sm">
                            <span class="input-group-text bg-white border-success text-success"><i class="fa-solid fa-magnifying-glass"></i></span>
                            <input type="text" id="apiSearchInput" class="form-control border-success" placeholder="Search movie from TMDB (e.g. Avengers, Inception)...">
                        </div>

                        <div id="apiLoading" class="text-center d-none my-4">
                            <div class="spinner-border text-success" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <p class="mt-2 text-muted">Searching the movie database...</p>
                        </div>

                        <div id="apiResults" class="row g-3">
                        </div>

                        <div class="text-center mt-4">
                            <hr>
                            <p class="text-muted small mb-2">Can't find your movie?</p>
                            <button class="btn btn-outline-secondary" onclick="openBlankForm()"><i class="fa-solid fa-pen-to-square me-1"></i> Enter manually</button>
                        </div>
                    </div>

                    <form id="addMovieForm" class="d-none">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h5 class="fw-bold text-dark mb-0 border-start border-success border-4 ps-2">Movie Information</h5>
                            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="backToSearch()"><i class="fa-solid fa-arrow-left"></i> Back to Search</button>
                        </div>

                        <input type="hidden" id="posterUrl" name="posterUrl">
                        <input type="hidden" id="bannerUrl" name="bannerUrl">
                        <input type="hidden" id="genres" name="genres">
                        <input type="hidden" id="movieTrailerUrl" name="trailerUrl"> <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Title <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="movieTitle" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold">Duration (Mins) <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="movieDuration" required min="1">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold">Release Date <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" id="movieReleaseDate" required>
                        </div>
                    </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Description <span class="text-danger">*</span></label>
                            <textarea class="form-control" id="movieDesc" rows="4" required></textarea>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Director</label>
                                <input type="text" class="form-control" id="movieDirector" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Actors</label>
                                <input type="text" class="form-control" id="movieActors" required>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label fw-bold">Rating (0-10)</label>
                                <input type="number" step="0.1" class="form-control" id="movieRating" required min="0" max="10">
                            </div>
                            <div class="col-md-2">
                                <label class="form-label fw-bold">Language</label>
                                <input type="text" class="form-control" id="movieLanguage" required>
                            </div>
                        </div>

                        <div class="row g-3 mb-4 align-items-end">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Categories (System) <span class="text-danger">*</span></label>
                                <div class="d-flex">
                                    <select class="form-select me-2" id="movieCategorySelect">
                                        <option value="" selected disabled>-- Select a category --</option>
                                    </select>
                                    <button type="button" class="btn btn-success" onclick="addCategoryTag()">Add</button>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Status <span class="text-danger">*</span></label>
                                <select class="form-select" id="movieStatus" required>
                                    <option value="Coming Soon">Coming Soon</option>
                                    <option value="Disabled">Disabled</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-2 p-3 bg-white border rounded">
                            <p class="fw-bold mb-2">Selected Categories:</p>
                            <div id="selectedCategoryTags" class="d-flex flex-wrap gap-2">
                                <span class="text-muted small">No categories selected yet.</span>
                            </div>
                        </div>

                        <h5 class="fw-bold text-dark mb-3 border-start border-success border-4 ps-2 mt-4">Media & Files</h5>
                        <div class="row g-4 mb-4 bg-white p-3 border rounded shadow-sm">
                            <div class="col-md-4">
                                <label class="form-label fw-bold text-primary"><i class="fa-solid fa-image"></i> Banner (Horizontal)</label>
                                <input class="form-control mb-2" type="file" id="movieBanner" accept="image/*">
                                <input type="text" class="form-control" id="bannerUrl" placeholder="Or TMDB Banner URL">

                                <div id="bannerPreviewContainer" class="mt-3 d-none text-center bg-light p-2 rounded border">
                                    <p class="small text-success fw-bold mb-1"><i class="fa-solid fa-check-circle"></i> Banner Ready</p>
                                    <img id="bannerPreview" src="" alt="Banner" style="width: 100%; height: 100px; border-radius: 5px; object-fit: cover;">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold text-primary"><i class="fa-solid fa-image"></i> Poster (Vertical)</label>
                                <input class="form-control mb-2" type="file" id="moviePosterFile" accept="image/*">
                                <input type="text" class="form-control" id="posterUrl" placeholder="Or TMDB Poster URL">

                                <div id="posterPreviewContainer" class="mt-3 d-none text-center bg-light p-2 rounded border">
                                    <p class="small text-success fw-bold mb-1"><i class="fa-solid fa-check-circle"></i> Fetched from TMDB</p>
                                    <img id="posterPreview" src="" alt="TMDB Poster" style="height: 150px; border-radius: 5px; object-fit: cover; box-shadow: 0 2px 5px rgba(0,0,0,0.2);">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold text-danger"><i class="fa-brands fa-youtube"></i> Trailer Video</label>
                                <input class="form-control mb-2" type="file" id="movieTrailer" accept="video/mp4">
                                <input type="text" class="form-control" id="movieTrailerUrl" placeholder="Or YouTube Embed Link">

                                <div id="trailerPreviewContainer" class="mt-3 d-none text-center bg-dark p-1 rounded border">
                                    <iframe id="trailerPreview" src="" style="width: 100%; height: 120px; border-radius: 5px;" frameborder="0" allowfullscreen></iframe>
                                </div>
                            </div>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4 pt-3 border-top">
                            <a href="/admin/movies/search" class="btn btn-light border px-4 fw-semibold">Cancel</a>
                            <button type="submit" class="btn btn-success px-4 fw-bold"><i class="fa-solid fa-floppy-disk me-1"></i> Save Movie</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin/addMovie.js}"></script>
</body>
</html>

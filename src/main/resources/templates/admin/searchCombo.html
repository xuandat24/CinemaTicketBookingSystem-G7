<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Combos - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin/universal.css}">
</head>
<body>
<div th:replace="~{admin/fragments/navbar :: admin-nav}"></div>

<div class="container mb-5">
    <div class="row mb-4 align-items-center">
        <div class="col-md-4">
            <h2 class="m-0"><i class="fa-solid fa-burger text-warning"></i> Manage Combos</h2>
        </div>

        <div class="col-md-5">
            <div class="input-group shadow-sm">
                <span class="input-group-text bg-white"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                <input type="text" id="searchComboInput" class="form-control" placeholder="Search combos by name...">
            </div>
        </div>

        <div class="col-md-3 text-end">
            <a th:href="@{/admin/combos/add}" class="btn btn-success shadow-sm">
                <i class="fa-solid fa-plus"></i> Add Combo
            </a>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover mb-0" id="comboTable">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Price (VND)</th>
                    <th>Image</th>
                    <th class="text-end pe-4">Actions</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin/admin-auth.js}"></script>
<script th:src="@{/js/admin/searchCombo.js}"></script>
</body>
</html>

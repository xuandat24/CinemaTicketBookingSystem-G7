<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Combos - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin/universal.css}">
    <link rel="stylesheet" th:href="@{/css/admin/combo.css}">
</head>
<body class="bg-light">
<div th:replace="~{admin/fragments/navbar :: admin-nav}"></div>

<div class="container-fluid px-4 py-4 mb-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="page-header-tech">
            <h2 class="fw-bold text-dark m-0"><i class="fa-solid fa-burger text-warning me-2"></i> Combo Management</h2>
            <p class="text-muted mb-0 mt-1">Manage food, beverages, and promotional packages.</p>
        </div>
        <a th:href="@{/admin/combos/add}" class="btn tech-btn tech-btn-orange">
            <i class="fa-solid fa-plus me-2"></i> Add Combo
        </a>
    </div>

    <div class="tech-card mb-4" style="background: linear-gradient(to right, #ffffff, #fff7ed);">
        <div class="row align-items-center">
            <div class="col-md-12">
                <label class="form-label-tech"><i class="fa-solid fa-magnifying-glass me-1 text-warning"></i> Search Combos</label>
                <div class="input-group shadow-sm" style="border-radius: 10px;">
                    <span class="input-group-text bg-white border-end-0" style="border-radius: 10px 0 0 10px; border-color: #cbd5e1;">
                        <i class="fa-solid fa-utensils text-muted"></i>
                    </span>
                    <input type="text" id="searchComboInput" class="form-control input-tech border-start-0 ps-0" placeholder="Type combo name to search..." style="border-radius: 0 10px 10px 0 !important;">
                </div>
            </div>
        </div>
    </div>

    <div class="tech-card p-4">
        <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
            <h5 class="m-0 text-dark fw-bold"><i class="fa-solid fa-list text-warning me-2"></i> Current Menu</h5>
        </div>

        <div class="table-responsive" style="overflow-y: hidden;">
            <table class="table-tech" id="comboTable">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Combo Details</th>
                    <th>Description</th>
                    <th>Price</th>
                    <th>Image</th>
                    <th class="text-end pe-4">Actions</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin/admin-auth.js}"></script>
<script th:src="@{/js/admin/searchCombo.js?v=99}"></script>
</body>
</html>

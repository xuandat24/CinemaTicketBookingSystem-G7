<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Category - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin/universal.css}">
</head>
<body class="bg-light">

<div th:replace="~{admin/fragments/navbar :: admin-nav}"></div>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white py-3">
                    <h5 class="mb-0 fw-bold"><i class="fa-solid fa-pen-to-square me-2"></i> Edit Category</h5>
                </div>
                <div class="card-body p-4">
                    <form id="editCategoryForm">
                        <div class="mb-4">
                            <label class="form-label fw-bold">Category Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control form-control-lg" id="editCategoryName" placeholder="Enter category name..." required>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4 pt-3 border-top">
                            <button type="button" class="btn btn-danger me-auto fw-bold" id="btnDeleteCategory">
                                <i class="fa-solid fa-trash-can me-1"></i> Delete
                            </button>
                            <a href="/admin/categories" class="btn btn-light border px-4 fw-semibold">Cancel</a>
                            <button type="submit" class="btn btn-success px-4 fw-bold">
                                <i class="fa-solid fa-floppy-disk me-1"></i> Update Category
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin/editCategory.js}"></script>
</body>
</html>

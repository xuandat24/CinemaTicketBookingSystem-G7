<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Category - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin/universal.css}">
    <link rel="stylesheet" th:href="@{/css/admin/category.css}">
</head>
<body class="bg-light">

<div th:replace="~{admin/fragments/navbar :: admin-nav}"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">

            <div class="setup-form-card">
                <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
                    <h3 class="fw-bold text-dark m-0"><i class="fa-solid fa-pen-to-square text-primary me-2"></i> Edit Category</h3>
                    <span class="badge bg-primary text-white px-3 py-2"><i class="fa-solid fa-shield-halved me-1"></i> Admin Access</span>
                </div>

                <form id="editCategoryForm">
                    <div class="mb-4 bg-light p-4 rounded-3 border">
                        <label class="form-label-tech">Category Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control input-tech" id="editCategoryName" placeholder="Enter category name..." required>

                        <div id="nameError" class="text-danger mt-2 small fw-bold" style="display: none;"></div>

                        <small class="text-muted mt-2 d-block fw-semibold"><i class="fa-solid fa-circle-info text-info me-1"></i> Special characters and numbers are restricted.</small>
                    </div>

                    <div class="d-flex justify-content-between mt-5 pt-4 border-top">
                        <button type="button" class="btn btn-outline-danger fw-bold tech-btn" id="btnDeleteCategory">
                            <i class="fa-solid fa-trash-can me-1"></i> Delete
                        </button>
                        <div class="d-flex gap-3">
                            <a href="/admin/categories" class="btn btn-light border fw-bold text-muted tech-btn">Cancel</a>
                            <button type="submit" class="btn btn-primary fw-bold tech-btn" style="box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);">
                                <i class="fa-solid fa-arrows-rotate me-2"></i> Update Category
                            </button>
                        </div>
                    </div>
                </form>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin/admin-auth.js}"></script>
<script th:src="@{/js/admin/editCategory.js?v=3}"></script>
</body>
</html>

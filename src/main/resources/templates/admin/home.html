<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - CTBS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin/universal.css}">
    <link rel="stylesheet" th:href="@{/css/admin/dashboard.css}">
</head>
<body class="bg-light">

<div th:replace="~{admin/fragments/navbar :: admin-nav}"></div>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-0">Cinema Dashboard</h2>
            <p class="text-muted">System revenue and activity statistics.</p>
        </div>
        <div class="btn-group" role="group">
            <input type="radio" class="btn-check" name="timeFilter" id="btnDay" value="day" checked onchange="updateDashboard()">
            <label class="btn btn-outline-primary" for="btnDay">Today</label>

            <input type="radio" class="btn-check" name="timeFilter" id="btnWeek" value="week" onchange="updateDashboard()">
            <label class="btn btn-outline-primary" for="btnWeek">This Week</label>

            <input type="radio" class="btn-check" name="timeFilter" id="btnMonth" value="month" onchange="updateDashboard()">
            <label class="btn btn-outline-primary" for="btnMonth">This Month</label>
        </div>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="card border-0 shadow-sm bg-primary text-white h-100">
                <div class="card-body">
                    <h6 class="text-uppercase opacity-75">Revenue</h6>
                    <h3 id="totalRevenue" class="fw-bold">0 VND</h3>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-0 shadow-sm bg-success text-white h-100">
                <div class="card-body">
                    <h6 class="text-uppercase opacity-75">Tickets Sold</h6>
                    <h3 id="totalTickets" class="fw-bold">0</h3>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-0 shadow-sm bg-warning text-dark h-100">
                <div class="card-body">
                    <h6 class="text-uppercase opacity-75">Top Movie</h6>
                    <h4 id="topMovieName" class="fw-bold text-truncate" title="Movie Name">-</h4>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-0 shadow-sm bg-info text-white h-100">
                <div class="card-body">
                    <h6 class="text-uppercase opacity-75">Combos Sold</h6>
                    <h3 id="totalCombos" class="fw-bold">0</h3>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4 mb-4">
        <div class="col-md-8">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title fw-bold mb-4">Top Grossing Movies</h5>
                    <div style="position: relative; height: 300px; width: 100%;">
                        <canvas id="topMoviesChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title fw-bold mb-4">Extra Services (Combos)</h5>
                    <div style="position: relative; height: 300px; width: 100%;">
                        <canvas id="combosChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4 mb-4">
        <div class="col-12">
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title fw-bold mb-4">Peak Booking Hours</h5>
                    <div style="position: relative; height: 300px; width: 100%;">
                        <canvas id="peakHoursChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row g-4 mb-5">
        <div class="col-12">
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h5 class="card-title fw-bold mb-0">Occupancy Rate</h5>
                        <div class="w-25">
                            <div class="input-group input-group-sm">
                                <span class="input-group-text bg-white text-muted border-end-0">
                                    <i class="fa-solid fa-magnifying-glass"></i>
                                </span>
                                <input type="text" id="occupancyMovieSearch" class="form-control border-start-0 ps-0" placeholder="Search movie...">
                            </div>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead class="table-light">
                            <tr>
                                <th width="25%">Movie</th>
                                <th width="15%">Time</th>
                                <th width="15%">Room</th>
                                <th width="15%" class="text-center">Tickets Sold</th>
                                <th width="30%">Occupancy Rate</th>
                            </tr>
                            </thead>
                            <tbody id="occupancyTableBody">
                            <tr><td colspan="5" class="text-center text-muted">Loading data...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script th:src="@{/js/admin/dashboard.js}"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Combo - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin/universal.css}">
    <link rel="stylesheet" th:href="@{/css/admin/combo.css}">
</head>
<body class="bg-light">
<div th:replace="~{admin/fragments/navbar :: admin-nav}"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <form id="addComboForm" class="setup-form-card">

                <div class="tech-form-header">
                    <h4><i class="fa-solid fa-burger text-warning me-2"></i> Create New Combo</h4>
                    <span class="badge bg-warning text-dark px-3 py-2"><i class="fa-solid fa-shield-halved me-1"></i> Admin</span>
                </div>

                <div class="row g-4 mb-4">
                    <div class="col-md-7">
                        <label class="form-label-tech">Combo Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control input-tech" id="comboName" required placeholder="e.g. Couple Popcorn...">
                    </div>
                    <div class="col-md-5">
                        <label class="form-label-tech">Price (VNĐ) <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-warning fw-bold">₫</span>
                            <input type="text" class="form-control input-tech border-start-0 ps-0" id="comboPrice" required placeholder="e.g. 65.000">
                        </div>
                    </div>
                    <div class="col-12">
                        <label class="form-label-tech">Description</label>
                        <textarea class="form-control input-tech" id="comboDescription" rows="3" placeholder="Describe the items included in this combo..."></textarea>
                    </div>
                    <div class="col-12">
                        <label class="form-label-tech">Image File</label>
                        <input type="file" class="form-control input-tech" id="comboImageFile" accept="image/*">
                        <small class="text-muted mt-2 d-block"><i class="fa-solid fa-circle-info text-info me-1"></i> Recommended: High-quality PNG/JPG with transparent background.</small>

                        <div class="mt-3 d-none image-preview-wrapper" id="comboImagePreviewContainer">
                            <p class="form-label-tech mb-2 text-muted">Image Preview</p>
                            <img id="comboImagePreview" alt="Combo preview">
                        </div>
                    </div>
                </div>

                <div id="formValidationError" class="text-danger fw-bold mt-2 text-end" style="display: none;"></div>

                <div class="d-grid gap-3 d-md-flex justify-content-md-end mt-4 pt-4 border-top">
                    <button type="button" class="btn btn-light border px-4 fw-bold text-muted tech-btn" onclick="window.location.href='/admin/combos'">Cancel</button>
                    <button type="submit" class="btn tech-btn tech-btn-orange"><i class="fa-solid fa-floppy-disk me-2"></i> Save Combo</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin/admin-auth.js}"></script>
<script th:src="@{/js/admin/addCombo.js?v=18}"></script>
</body>
</html>

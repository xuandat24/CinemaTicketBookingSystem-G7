<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Combo - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin/universal.css}">
</head>
<body>
<div th:replace="~{admin/fragments/navbar :: admin-nav}"></div>

<div class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0"><i class="fa-solid fa-burger"></i> Add New Combo</h4>
                </div>
                <div class="card-body p-4">
                    <form id="addComboForm">
                        <div class="mb-3">
                            <label for="comboName" class="form-label fw-bold">Combo Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="comboName" required minlength="2" placeholder="e.g. Family Combo">
                        </div>

                        <div class="mb-3">
                            <label for="comboDescription" class="form-label fw-bold">Description</label>
                            <textarea class="form-control" id="comboDescription" rows="3" placeholder="Describe this combo..."></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="comboPrice" class="form-label fw-bold">Price (VND) <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="comboPrice" min="0" required placeholder="e.g. 65000">
                        </div>

                        <div class="mb-4">
                            <label for="comboImageFile" class="form-label fw-bold">Image File</label>
                            <input type="file" class="form-control" id="comboImageFile" accept="image/*">
                            <div class="form-text">Choose an image from your computer (optional).</div>
                            <div class="mt-3 d-none" id="comboImagePreviewContainer">
                                <img id="comboImagePreview" alt="Combo preview" class="img-thumbnail" style="max-height: 180px;">
                            </div>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <button type="button" class="btn btn-light border" onclick="window.location.href='/admin/combos'">Cancel</button>
                            <button type="submit" class="btn btn-success">Save Combo</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin/admin-auth.js}"></script>
<script th:src="@{/js/admin/addCombo.js}"></script>
</body>
</html>

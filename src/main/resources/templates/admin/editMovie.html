<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Movie - Admin System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin/universal.css}">
    <style>
        .setup-form-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.06);
            border: 1px solid #e2e8f0;
        }

        .form-label-tech {
            font-weight: 700;
            color: #475569;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        .input-tech {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 12px 15px;
            font-weight: 500;
            transition: 0.3s;
        }

        .input-tech:focus {
            background: #ffffff;
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }
    </style>
</head>
<body class="bg-light">

<div th:replace="~{admin/fragments/navbar :: admin-nav}"></div>

<div class="container-fluid px-4 py-4 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">

            <div class="d-flex align-items-center mb-4">
                <button class="btn btn-white border shadow-sm me-3 fw-bold rounded-pill px-4"
                        onclick="window.location.href='/admin/movies/search'">
                    <i class="fa-solid fa-arrow-left me-1"></i> Back to Database
                </button>
            </div>

            <div class="setup-form-card">
                <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
                    <h3 class="fw-bold text-dark m-0"><i class="fa-solid fa-pen-to-square text-primary me-2"></i> Update
                        Movie Record</h3>
                    <span class="badge bg-primary text-white px-3 py-2"><i class="fa-solid fa-shield-halved me-1"></i> Admin Access</span>
                </div>

                <form id="editMovieForm">
                    <input id="editMovieId" type="hidden">

                    <div class="row g-4">
                        <div class="col-lg-8">
                            <div class="row g-3 bg-light p-3 rounded-3 border">
                                <div class="col-12">
                                    <label class="form-label-tech">Movie Title <span
                                            class="text-danger">*</span></label>
                                    <input class="form-control input-tech" id="movieTitle" required type="text">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label-tech">Duration (Min) <span
                                            class="text-danger">*</span></label>
                                    <input class="form-control input-tech" id="movieDuration" min="1" required
                                           type="number">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label-tech">Release Date <span
                                            class="text-danger">*</span></label>
                                    <input class="form-control input-tech" id="movieReleaseDate" required type="date">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label-tech">Language <span class="text-danger">*</span></label>
                                    <input class="form-control input-tech" id="movieLanguage" required type="text">
                                </div>
                                <div class="col-12 mt-3">
                                    <label class="form-label-tech">Synopsis / Description <span
                                            class="text-danger">*</span></label>
                                    <textarea class="form-control input-tech" id="movieDesc" required
                                              rows="4"></textarea>
                                </div>
                            </div>
                        </div>

                        <div class="col-lg-4">
                            <div class="row g-3">
                                <div class="col-12">
                                    <label class="form-label-tech">Status <span class="text-danger">*</span></label>
                                    <select class="form-select input-tech" id="movieStatus" required>
                                        <option value="Now Playing">Now Playing</option>
                                        <option value="Coming Soon">Coming Soon</option>
                                        <option value="Pending">Pending</option>
                                        <option value="Disabled">Disabled</option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label class="form-label-tech">Director <span class="text-danger">*</span></label>
                                    <input class="form-control input-tech" id="movieDirector" required type="text">
                                </div>
                                <div class="col-12">
                                    <label class="form-label-tech">Cast / Actors <span
                                            class="text-danger">*</span></label>
                                    <input class="form-control input-tech" id="movieActors" required type="text">
                                </div>
                                <div class="col-12">
                                    <label class="form-label-tech">TMDB Rating (0-10)</label>
                                    <input class="form-control input-tech" id="movieRating" max="10" min="0"
                                           required step="0.1" type="number">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row mt-4 p-3 bg-white border rounded-3 shadow-sm">
                        <div class="col-md-6">
                            <label class="form-label-tech text-primary"><i class="fa-solid fa-layer-group"></i> Manage
                                Categories <span class="text-danger">*</span></label>
                            <div class="d-flex gap-2">
                                <select class="form-select input-tech" id="movieCategorySelect">
                                    <option disabled selected value="">-- Select a category to add --</option>
                                </select>
                                <button class="btn btn-primary fw-bold px-4" onclick="addCategoryTag()" type="button"><i
                                        class="fa-solid fa-plus"></i></button>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label-tech">Selected Categories:</label>
                            <div class="d-flex flex-wrap gap-2 p-2 border rounded" id="selectedCategoryTags"
                                 style="min-height: 48px; background: #f8fafc;">
                            </div>
                        </div>
                    </div>

                    <h5 class="fw-bold text-dark mt-5 mb-3 border-start border-primary border-4 ps-2">Update Media
                        Files</h5>
                    <div class="row g-4 mb-4">
                        <div class="col-md-4">
                            <div class="p-3 border rounded-3 bg-light h-100">
                                <label class="form-label-tech text-info"><i class="fa-solid fa-image"></i> New
                                    Banner</label>
                                <input accept="image/*" class="form-control input-tech mb-2" id="movieBanner"
                                       type="file">
                                <input class="form-control input-tech" id="bannerUrl" placeholder="Or Paste New URL"
                                       type="text">
                                <div class="mt-3 d-none text-center bg-white p-2 rounded border shadow-sm"
                                     id="currentBannerContainer">
                                    <p class="text-muted small fw-bold mb-1">Current Banner</p>
                                    <img id="currentBannerImg" src=""
                                         style="width: 100%; height: 100px; border-radius: 5px; object-fit: cover;">
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="p-3 border rounded-3 bg-light h-100">
                                <label class="form-label-tech text-info"><i class="fa-solid fa-image"></i> New
                                    Poster</label>
                                <input accept="image/*" class="form-control input-tech mb-2" id="moviePosterFile"
                                       type="file">
                                <input class="form-control input-tech" id="posterUrl" placeholder="Or Paste New URL"
                                       type="text">
                                <div class="mt-3 d-none text-center bg-white p-2 rounded border shadow-sm"
                                     id="currentPosterContainer">
                                    <p class="text-muted small fw-bold mb-1">Current Poster</p>
                                    <img id="currentPosterImg" src=""
                                         style="height: 150px; border-radius: 5px; object-fit: cover;">
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="p-3 border rounded-3 bg-light h-100">
                                <label class="form-label-tech text-danger"><i class="fa-brands fa-youtube"></i> New
                                    Trailer</label>
                                <input accept="video/mp4" class="form-control input-tech mb-2" id="movieTrailer"
                                       type="file">
                                <input class="form-control input-tech" id="movieTrailerUrl" placeholder="Or Paste YouTube Link"
                                       type="text">
                                <div class="mt-3 d-none text-center bg-dark p-1 rounded border shadow-sm"
                                     id="currentTrailerContainer">
                                    <p class="text-light small fw-bold mb-1 mt-1">Current Trailer</p>
                                    <div id="trailerMediaWrapper"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <
                    <div class="text-danger fw-bold mt-4 text-end" id="formValidationError"
                         style="display: none;"></div>

                    <div class="d-flex justify-content-between mt-3 pt-4 border-top">
                        <button class="btn btn-outline-danger px-4 fw-bold" id="btnDeleteMovie" style="border-radius: 10px;"
                                type="button">
                            <i class="fa-solid fa-trash me-2"></i> Disable Movie
                        </button>
                        <button class="btn btn-primary px-5 py-2 fw-bold fs-5" id="btnUpdate" style="border-radius: 10px; box-shadow: 0 5px 15px rgba(59, 130, 246, 0.3);"
                                type="submit">
                            <i class="fa-solid fa-arrows-rotate me-2"></i> Update Movie Data
                        </button>
                    </div>

                </form>
            </div>

        </div>
    </div>
</div>

<script th:src="@{/js/admin/admin-auth.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script th:src="@{/js/admin/editMovie.js?v=2}"></script>
</body>
</html>

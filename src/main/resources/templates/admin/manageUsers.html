<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Users - Admin CTBS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <link rel="stylesheet" th:href="@{/css/admin/universal.css}">
    <link rel="stylesheet" th:href="@{/css/admin/home.css}">
    <link rel="stylesheet" th:href="@{/css/admin/manageUsers.css}">

</head>
<body>

<div th:replace="~{admin/fragments/navbar :: admin-nav}"></div>

<div class="container-fluid px-4 py-5 animate__animated animate__fadeIn">
    <div class="d-flex justify-content-between align-items-end mb-5">
        <div>
            <h2 class="fw-bolder text-dark m-0" style="letter-spacing: -0.5px;">User Management</h2>
            <p class="text-secondary mb-0 mt-2">Manage accounts, assign roles, and secure your platform.</p>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-light shadow-sm text-secondary fw-bold px-4 rounded-pill border-0 hover-lift" onclick="fetchUsers()">
                <i class="fa-solid fa-rotate-right me-1"></i> Refresh
            </button>
            <button class="btn btn-primary shadow-sm fw-bold px-4 rounded-pill border-0" onclick="openAddModal()" style="background: #4e73df;">
                <i class="fa-solid fa-plus me-1"></i> Add New User
            </button>
        </div>
    </div>

    <div class="row g-4 mb-5">
        <div class="col-xl-3 col-md-6">
            <div class="metric-card total">
                <div><div class="metric-title">Total Users</div><div class="metric-value" id="statTotal">0</div></div>
                <i class="fa-solid fa-users metric-icon"></i>
            </div>
        </div>
        <div class="col-xl-3 col-md-6">
            <div class="metric-card admin">
                <div><div class="metric-title">Administrators</div><div class="metric-value" id="statAdmin">0</div></div>
                <i class="fa-solid fa-user-shield metric-icon"></i>
            </div>
        </div>
        <div class="col-xl-3 col-md-6">
            <div class="metric-card local">
                <div><div class="metric-title">Local Accounts</div><div class="metric-value" id="statLocal">0</div></div>
                <i class="fa-solid fa-envelope metric-icon"></i>
            </div>
        </div>
        <div class="col-xl-3 col-md-6">
            <div class="metric-card google">
                <div><div class="metric-title">Google Accounts</div><div class="metric-value" id="statGoogle">0</div></div>
                <i class="fa-brands fa-google metric-icon"></i>
            </div>
        </div>
    </div>

    <div class="table-responsive px-1 pb-3">
        <table class="table table-custom w-100">
            <thead>
            <tr>
                <th width="25%">User Information</th>
                <th width="20%">Username</th>
                <th width="20%">Contact</th>
                <th width="15%">Role</th>
                <th width="20%" class="text-end pe-4">Actions</th>
            </tr>
            </thead>
            <tbody id="userTableBody">
            </tbody>
        </table>
    </div>
</div>

<div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold text-dark" id="modalTitle"><i class="fa-solid fa-user-pen text-primary me-2"></i> User Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="userForm" novalidate>
                    <div class="row g-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold text-secondary small text-uppercase">Username <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0 text-muted"><i class="fa-solid fa-at"></i></span>
                                <input type="text" class="form-control border-start-0 ps-0" id="userName" placeholder="johndoe123">
                            </div>
                            <small class="text-danger fw-bold mt-1 d-block" id="err-userName"></small>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold text-secondary small text-uppercase">Email <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0 text-muted"><i class="fa-solid fa-envelope"></i></span>
                                <input type="email" class="form-control border-start-0 ps-0" id="email" placeholder="john@example.com">
                            </div>
                            <small class="text-danger fw-bold mt-1 d-block" id="err-email"></small>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold text-secondary small text-uppercase">First Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="firstName" placeholder="John">
                            <small class="text-danger fw-bold mt-1 d-block" id="err-firstName"></small>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold text-secondary small text-uppercase">Last Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="lastName" placeholder="Doe">
                            <small class="text-danger fw-bold mt-1 d-block" id="err-lastName"></small>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold text-secondary small text-uppercase">Phone <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0 text-muted"><i class="fa-solid fa-phone"></i></span>
                                <input type="text" class="form-control border-start-0 ps-0" id="phone" placeholder="09xxxxxxxx">
                            </div>
                            <small class="text-danger fw-bold mt-1 d-block" id="err-phone"></small>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold text-secondary small text-uppercase">Date of Birth <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" id="dob">
                            <small class="text-danger fw-bold mt-1 d-block" id="err-dob"></small>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold text-secondary small text-uppercase">Gender</label>
                            <select class="form-select" id="gender">
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="col-md-6" id="createdAtGroup">
                            <label class="form-label fw-bold text-secondary small text-uppercase">Account Created</label>
                            <input type="text" class="form-control bg-white text-muted" id="createdAt" readonly style="cursor: not-allowed; border-style: dashed;">
                        </div>

                        <div class="col-12"><hr class="text-muted opacity-25 my-1"></div>

                        <div class="col-md-6" id="passwordGroup">
                            <label class="form-label fw-bold text-danger small text-uppercase">Password <span class="text-muted fw-normal text-lowercase">(Required for new)</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0 text-muted"><i class="fa-solid fa-lock"></i></span>
                                <input type="password" class="form-control border-start-0 ps-0" id="password" placeholder="••••••••">
                            </div>
                            <small class="text-danger fw-bold mt-1 d-block" id="err-password"></small>
                        </div>
                        <div class="col-md-6" id="rePasswordGroup">
                            <label class="form-label fw-bold text-danger small text-uppercase">Confirm Password</label>
                            <input type="password" class="form-control" id="rePassword" placeholder="••••••••">
                            <small class="text-danger fw-bold mt-1 d-block" id="err-rePassword"></small>
                        </div>
                    </div>
                    <input type="hidden" id="userId">
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light fw-bold px-4 rounded-pill" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary fw-bold px-4 rounded-pill shadow-sm" onclick="saveUser()"><i class="fa-solid fa-check me-1"></i> Save Changes</button>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/admin/admin-auth.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin/manageUsers.js}"></script>

</body>
</html>

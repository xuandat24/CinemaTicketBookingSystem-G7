<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Feedbacks - Admin CTBS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin/universal.css}">
    <link rel="stylesheet" th:href="@{/css/admin/home.css}">
</head>
<body class="bg-light">

<div th:replace="~{admin/fragments/navbar :: admin-nav}"></div>

<div class="container-fluid px-4 py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold text-dark m-0">User Feedbacks</h2>
            <p class="text-muted mb-0 mt-1">Read and manage feedback from the Contact Us form.</p>
        </div>
        <button class="btn btn-primary shadow-sm px-4 py-2 fw-semibold" onclick="fetchFeedbacks()">
            <i class="fa-solid fa-rotate-right me-2"></i> Refresh Data
        </button>
    </div>

    <div class="card shadow-sm border-0" style="border-radius: 12px; overflow: hidden;">
        <div class="card-body p-0 table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light" style="border-bottom: 2px solid #dee2e6;">
                <tr>
                    <th class="ps-4 py-3" style="width: 15%;">Date</th>
                    <th class="py-3" style="width: 15%;">Customer Name</th>
                    <th class="py-3" style="width: 20%;">Email</th>
                    <th class="py-3" style="width: 30%;">Message</th>
                    <th class="py-3" style="width: 10%;">Status</th>
                    <th class="text-end pe-4 py-3" style="width: 10%;">Actions</th>
                </tr>
                </thead>
                <tbody id="feedbackTableBody">
                <tr>
                    <td colspan="6" class="text-center py-5 text-muted">
                        <i class="fa fa-spinner fa-spin fa-2x mb-3 d-block"></i> Loading data...
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin/admin-auth.js}"></script>
<script>
    document.addEventListener("DOMContentLoaded", fetchFeedbacks);

    async function fetchFeedbacks() {
        const token = sessionStorage.getItem("jwtToken"); // Lấy token từ sessionStorage của Admin
        try {
            // Gọi API từ AdminFeedbackController
            const response = await fetch('/api/admin/feedbacks', {
                method: 'GET',
                headers: { 'Authorization': 'Bearer ' + token }
            });

            if (response.ok) {
                const feedbacks = await response.json();
                renderTable(feedbacks);
            } else {
                if(response.status === 403 || response.status === 401 || response.status === 404) {
                    alert("Your session has expired or you do not have permission to access this page!");
                    window.location.href = '/login';
                }
            }
        } catch (error) {
            console.error("Error:", error);
        }
    }

    function renderTable(feedbacks) {
        const tbody = document.getElementById("feedbackTableBody");
        tbody.innerHTML = "";

        if (feedbacks.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center py-5 text-muted"><i class="fa-solid fa-envelope-open fa-3x mb-3 d-block text-black-50"></i>Inbox is empty. No messages yet.</td></tr>`;
            return;
        }

        feedbacks.forEach(fb => {
            // Format ngày giờ đẹp mắt
            const dateObj = new Date(fb.createdAt);
            const dateStr = dateObj.toLocaleString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute:'2-digit' });

            // Xử lý huy hiệu trạng thái
            const statusBadge = fb.read
                ? '<span class="badge bg-secondary px-2 py-1"><i class="fa-solid fa-check-double me-1"></i> Read</span>'
                : '<span class="badge bg-danger px-2 py-1"><i class="fa-solid fa-envelope me-1"></i> New</span>';

            // Nút "Đánh dấu đã đọc" (ẩn đi nếu đã đọc rồi)
            const readBtn = fb.read
                ? ''
                : `<button class="btn btn-sm btn-outline-success me-2" onclick="markAsRead(${fb.id})" title="Mark as read"><i class="fa-solid fa-check"></i></button>`;

            tbody.innerHTML += `
                <tr class="${fb.read ? '' : 'table-warning'}">
                    <td class="ps-4 text-muted small">${dateStr}</td>
                    <td class="fw-bold text-dark">${fb.name}</td>
                    <td><a href="mailto:${fb.email}" class="text-decoration-none text-primary">${fb.email}</a></td>
                    <td style="max-width: 300px; white-space: pre-wrap; font-size: 0.95rem;">${fb.message}</td>
                    <td>${statusBadge}</td>
                    <td class="text-end pe-4">
                        ${readBtn}
                        <button class="btn btn-sm btn-danger shadow-sm" onclick="deleteFeedback(${fb.id})" title="Delete message"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>
            `;
        });
    }

    async function markAsRead(id) {
        const token = sessionStorage.getItem("jwtToken");
        try {
            await fetch(`/api/admin/feedbacks/${id}/read`, {
                method: 'PUT',
                headers: { 'Authorization': 'Bearer ' + token }
            });
            fetchFeedbacks(); // Tải lại bảng để cập nhật trạng thái
        } catch (error) {
            alert("Error updating status!");
        }
    }

    async function deleteFeedback(id) {
        if (!confirm("Are you sure you want to permanently delete this message?")) return;
        const token = sessionStorage.getItem("jwtToken");
        try {
            await fetch(`/api/admin/feedbacks/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + token }
            });
            fetchFeedbacks(); // Tải lại bảng sau khi xóa
        } catch (error) {
            alert("Error deleting message!");
        }
    }
</script>
</body>
</html>

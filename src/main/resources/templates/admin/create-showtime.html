<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Showtime - Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/admin/univarsal.css}">
</head>

<body>

<div th:replace="~{admin/fragments/navbar :: admin-nav}"></div>

<div class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-md-7">

            <div class="card shadow-sm border-0">

                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">
                        <i class="fa-solid fa-clock"></i> Create New Showtime
                    </h4>
                </div>

                <div class="card-body p-4">

                    <form id="createShowtimeForm">

                        <!-- Movie -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Movie <span class="text-danger">*</span>
                            </label>
                            <select class="form-select" id="movieId" required>
                                <option value="">Select Movie</option>
                            </select>
                        </div>

                        <!-- TheaterRoom -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Screen <span class="text-danger">*</span>
                            </label>
                            <select class="form-select" id="roomId" required>
                                <option value="">Select Room</option>
                            </select>
                        </div>

                        <!-- Start Time -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Start Time <span class="text-danger">*</span>
                            </label>
                            <input type="datetime-local"
                                   class="form-control"
                                   id="startTime"
                                   required>
                        </div>

                        <!-- Format -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Format <span class="text-danger">*</span>
                            </label>

                            <select class="form-select" id="format" required>
                                <option value="">Select format</option>
                                <option value="TWO_D">2D</option>
                                <option value="THREE_D">3D</option>
                                <option value="IMAX">IMAX</option>
                            </select>
                        </div>

                        <!-- Price -->
                        <div class="mb-4">
                            <label class="form-label fw-bold">
                                Ticket Price <span class="text-danger">*</span>
                            </label>
                            <input type="number"
                                   class="form-control"
                                   id="price"
                                   placeholder="Example: 75000"
                                   min="10000"
                                   required>
                        </div>

                        <!-- Buttons -->
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">

                            <button type="button"
                                    class="btn btn-light border"
                                    onclick="window.history.back()">
                                Cancel
                            </button>

                            <button type="submit"
                                    class="btn btn-success">
                                Create Showtime
                            </button>

                        </div>

                    </form>
                    <div id="message" class="mt-3"></div>

                </div>
            </div>

        </div>
    </div>
</div>

<script th:src="@{/js/admin/addShowtime.js}"></script>

</body>
</html>

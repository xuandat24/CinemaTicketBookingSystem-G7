<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Showtime - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin/universal.css}">
    <link rel="stylesheet" th:href="@{/css/admin/addShowtime.css}">
</head>
<body class="bg-light">

<div th:replace="~{admin/fragments/navbar :: admin-nav}"></div>

<div class="container mb-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <form id="createShowtimeForm" class="setup-form-card">

                <div class="tech-form-header">
                    <h4><i class="fa-solid fa-clock text-success me-2"></i> Create New Showtime</h4>
                    <span class="badge bg-success text-white px-3 py-2"><i class="fa-solid fa-shield-halved me-1"></i> Admin</span>
                </div>

                <div class="row g-4 mb-4">
                    <div class="col-md-6">
                        <label class="form-label-tech">Select Movie <span class="text-danger">*</span></label>
                        <select class="form-select input-tech" id="movieId" required>
                            <option value="">-- Choose a movie --</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label-tech">Theater Screen <span class="text-danger">*</span></label>
                        <select class="form-select input-tech" id="roomId" required>
                            <option value="">-- Choose a room --</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label-tech">Start Time <span class="text-danger">*</span></label>
                        <input type="datetime-local" class="form-control input-tech" id="startTime" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label-tech">Format <span class="text-danger">*</span></label>
                        <select class="form-select input-tech" id="format" required>
                            <option value="">-- Select format --</option>
                            <option value="TWO_D">Standard 2D</option>
                            <option value="THREE_D">RealD 3D</option>
                            <option value="IMAX">IMAX Experience</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label-tech">Ticket Base Price (VNĐ) <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-success fw-bold">₫</span>
                            <input type="text" class="form-control input-tech border-start-0 ps-0" id="price" placeholder="e.g. 50.000" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label-tech">Status <span class="text-danger">*</span></label>
                        <select class="form-select input-tech" id="status" required>
                            <option value="ACTIVE">Active (On Sale)</option>
                            <option value="INACTIVE">Inactive (Hidden)</option>
                        </select>
                    </div>
                </div>

                <div id="formValidationError" class="text-danger fw-bold mt-2 text-end" style="display: none;"></div>

                <div class="d-grid gap-3 d-md-flex justify-content-md-end mt-4 pt-4 border-top">
                    <button type="button" class="btn btn-light border px-4 fw-bold text-muted tech-btn" onclick="window.history.back()">Cancel</button>
                    <button type="submit" class="btn tech-btn tech-btn-success"><i class="fa-solid fa-floppy-disk me-2"></i> Create Showtime</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin/admin-auth.js}"></script>
<script th:src="@{/js/admin/addShowtime.js?v=3}"></script>
</body>
</html>

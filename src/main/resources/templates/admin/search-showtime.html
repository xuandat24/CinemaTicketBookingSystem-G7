<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Showtime Management - Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

</head>
<body>

<div th:replace="~{admin/fragments/navbar :: admin-nav}"></div>

<div class="container-fluid px-4 py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold">Showtime Management</h2>
            <p class="text-muted">Manage all showtimes</p>
        </div>
        <a th:href="@{/admin/showtimes/create}" class="btn btn-primary">
            + Add Showtime
        </a>
    </div>
    <div id="message"></div>
    <!-- Filter -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="row g-2">

                <div class="col-md-2">
                    <label>Showtime ID</label>
                    <input type="number" id="filterId" class="form-control" placeholder="Enter ID">
                </div>

                <div class="col-md-3">
                    <label>Movie</label>
                    <input type="text" id="filterKeyword" class="form-control" placeholder="Search movie...">
                </div>

                <div class="col-md-3">
                    <label>Room</label>
                    <select id="filterRoom" class="form-select">
                        <option value="">All Rooms</option>
                    </select>
                </div>

                <div class="col-md-3">
                    <label>Date</label>
                    <input type="date" id="filterDate" class="form-control">
                </div>

                <div class="col-md-1 d-flex align-items-end">
                    <button class="btn btn-secondary w-100" onclick="resetFilter()">Reset</button>
                </div>

            </div>
        </div>
    </div>

    <!-- Table -->
    <div class="card">
        <div class="card-body table-responsive">
            <table class="table table-hover">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Movie</th>
                    <th>Room</th>
                    <th>Start</th>
                    <th>End</th>
                    <th>Price</th>
                    <th>Format</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody id="showtimeTable"></tbody>
            </table>
        </div>
    </div>

</div>

<script th:src="@{/js/admin/searchShowtime.js}"></script>
</body>
</html>

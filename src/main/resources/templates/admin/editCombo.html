<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Combo - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin/universal.css}">
    <link rel="stylesheet" th:href="@{/css/admin/combo.css}">
</head>
<body class="bg-light">
<div th:replace="~{admin/fragments/navbar :: admin-nav}"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <form id="editComboForm" class="setup-form-card">

                <div class="tech-form-header edit-mode">
                    <h4><i class="fa-solid fa-pen-to-square text-warning me-2"></i> Update Combo</h4>
                    <span class="badge bg-warning text-dark px-3 py-2"><i class="fa-solid fa-shield-halved me-1"></i> Admin</span>
                </div>

                <div class="row g-4 mb-4">
                    <div class="col-md-7">
                        <label class="form-label-tech">Combo Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control input-tech edit-focus" id="editComboName" required>
                    </div>
                    <div class="col-md-5">
                        <label class="form-label-tech">Price (VNĐ) <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-warning fw-bold">₫</span>
                            <input type="text" class="form-control input-tech edit-focus border-start-0 ps-0" id="editComboPrice" required>
                        </div>
                    </div>
                    <div class="col-12">
                        <label class="form-label-tech">Description</label>
                        <textarea class="form-control input-tech edit-focus" id="editComboDescription" rows="3"></textarea>
                    </div>
                    <div class="col-12">
                        <label class="form-label-tech">Update Image File</label>
                        <input type="file" class="form-control input-tech edit-focus" id="editComboImageFile" accept="image/*">
                        <small class="text-muted mt-2 d-block"><i class="fa-solid fa-circle-info text-info me-1"></i> Leave empty if you want to keep the current image.</small>
                    </div>

                    <div class="col-12" id="currentImageBlock">
                        <div class="image-preview-wrapper" id="editComboImagePreviewContainer">
                            <p class="form-label-tech mb-2 text-muted">Current Output Image</p>
                            <img id="editComboImagePreview" alt="Combo preview">
                            <input type="hidden" id="editComboImagePath">
                        </div>
                    </div>
                </div>

                <div id="formValidationError" class="text-danger fw-bold mt-2 text-end" style="display: none;"></div>

                <div class="d-flex justify-content-between mt-4 pt-4 border-top">
                    <button type="button" class="btn btn-outline-danger fw-bold tech-btn" id="btnDeleteCombo">
                        <i class="fa-solid fa-trash-can me-1"></i> Delete
                    </button>
                    <div class="d-flex gap-3">
                        <a href="/admin/combos" class="btn btn-light border fw-bold text-muted tech-btn">Cancel</a>
                        <button type="submit" class="btn tech-btn tech-btn-amber">
                            <i class="fa-solid fa-arrows-rotate me-2"></i> Update Combo
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin/admin-auth.js}"></script>
<script th:src="@{/js/admin/editCombo.js?v=18}"></script>
</body>
</html>

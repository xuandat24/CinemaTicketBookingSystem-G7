<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Combo - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin/universal.css}">
</head>
<body class="bg-light">
<div th:replace="~{admin/fragments/navbar :: admin-nav}"></div>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white py-3">
                    <h5 class="mb-0 fw-bold"><i class="fa-solid fa-pen-to-square me-2"></i> Edit Combo</h5>
                </div>
                <div class="card-body p-4">
                    <form id="editComboForm">
                        <div class="mb-3">
                            <label for="editComboName" class="form-label fw-bold">Combo Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="editComboName" required minlength="2">
                        </div>

                        <div class="mb-3">
                            <label for="editComboDescription" class="form-label fw-bold">Description</label>
                            <textarea class="form-control" id="editComboDescription" rows="3"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="editComboPrice" class="form-label fw-bold">Price (VND) <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="editComboPrice" min="0" required>
                        </div>

                        <div class="mb-3">
                            <label for="editComboImageFile" class="form-label fw-bold">Image File</label>
                            <input type="file" class="form-control" id="editComboImageFile" accept="image/*">
                            <div class="form-text">Leave empty if you want to keep current image.</div>
                        </div>

                        <div class="mb-4" id="currentImageBlock">
                            <label class="form-label fw-bold">Current Image Path</label>
                            <input type="text" class="form-control" id="editComboImagePath" readonly>
                            <div class="mt-3 d-none" id="editComboImagePreviewContainer">
                                <img id="editComboImagePreview" alt="Combo preview" class="img-thumbnail" style="max-height: 180px;">
                            </div>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4 pt-3 border-top">
                            <button type="button" class="btn btn-danger me-auto fw-bold" id="btnDeleteCombo">
                                <i class="fa-solid fa-trash-can me-1"></i> Delete
                            </button>
                            <a href="/admin/combos" class="btn btn-light border px-4 fw-semibold">Cancel</a>
                            <button type="submit" class="btn btn-success px-4 fw-bold">
                                <i class="fa-solid fa-floppy-disk me-1"></i> Update Combo
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin/admin-auth.js}"></script>
<script th:src="@{/js/admin/editCombo.js}"></script>
</body>
</html>

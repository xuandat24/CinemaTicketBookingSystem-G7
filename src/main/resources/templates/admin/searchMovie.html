<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Movie Management - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin/searchMovie.css}">
</head>
<body>

<div th:replace="~{admin/fragments/navbar :: admin-nav}"></div>

<div class="container-fluid px-4 py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold text-dark m-0">Movie Management</h2>
            <p class="text-muted mb-0 mt-1">Manage, search, and update your cinema's movie list.</p>
        </div>
        <a th:href="@{/admin/movies/add}" class="btn btn-primary shadow-sm px-4 py-2 fw-semibold">
            <i class="fa-solid fa-plus me-2"></i> Add New Movie
        </a>
    </div>

    <div class="card shadow-sm mb-4 border-0">
        <div class="card-body bg-white rounded">
            <form id="filterForm" class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label class="form-label fw-bold text-secondary small mb-1">Search Title</label>
                    <input type="text" class="form-control form-control-sm" id="searchTitle" placeholder="Title...">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold text-secondary small mb-1">Category</label>
                    <select class="form-select form-select-sm" id="filterCategory">
                        <option value="">-- All Categories --</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold text-secondary small mb-1">Language</label>
                    <input type="text" class="form-control form-control-sm" id="searchLanguage" placeholder="e.g. English, Korean">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold text-secondary small mb-1">Status</label>
                    <select class="form-select form-select-sm" id="filterStatus">
                        <option value="">-- All Status --</option>
                        <option value="Now Playing">Now Playing</option>
                        <option value="Coming Soon">Coming Soon</option>
                        <option value="Pending">Pending</option>
                        <option value="Disabled">Disabled</option>
                    </select>
                </div>

                <div class="col-md-3">
                    <label class="form-label fw-bold text-secondary small mb-1">From Date</label>
                    <input type="date" class="form-control form-control-sm" id="fromDate">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold text-secondary small mb-1">To Date</label>
                    <input type="date" class="form-control form-control-sm" id="toDate">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold text-secondary small mb-1">Sort</label>
                    <select class="form-select form-select-sm" id="sortBy">
                        <option value="id">Newest First</option>
                        <option value="name">A-Z (Title)</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <button type="button" class="btn btn-primary btn-sm w-100 fw-bold" onclick="applyFilter()" title="Apply Filter">
                        <i class="fa-solid fa-filter me-1"></i> Apply
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm table-card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="m-0 text-secondary fw-bold" id="tableTitle">Current Movies</h5>
        </div>

        <div class="card-body p-0 table-responsive">
            <table class="table table-hover align-middle mb-0" id="movieTable">
                <thead class="custom-thead">
                <tr>
                    <th scope="col" class="ps-4 py-3" style="width: 5%;">ID</th>
                    <th scope="col" class="py-3" style="width: 35%;">Movie Information</th>
                    <th scope="col" class="py-3" style="width: 15%;">Release Date</th>
                    <th scope="col" class="py-3" style="width: 20%;">Status</th>
                    <th scope="col" class="text-end pe-4 py-3" style="width: 25%;">Actions</th>
                </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin/searchMovie.js}"></script>

</body>
</html>

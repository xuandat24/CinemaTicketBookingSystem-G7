<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Categories - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin/universal.css}">
    <link rel="stylesheet" th:href="@{/css/admin/category.css}">
</head>
<body class="bg-light">
<div th:replace="~{admin/fragments/navbar :: admin-nav}"></div>

<div class="container-fluid px-4 py-4 mb-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="page-header-tech">
            <h2 class="fw-bold text-dark m-0">Category Management</h2>
            <p class="text-muted mb-0 mt-1">Organize and structure your movie genres seamlessly.</p>
        </div>
        <a th:href="@{/admin/categories/add}" class="btn tech-btn tech-btn-success">
            <i class="fa-solid fa-plus me-2"></i> Add Category
        </a>
    </div>

    <div class="tech-card mb-4" style="background: linear-gradient(to right, #ffffff, #f0fdf4);">
        <div class="row align-items-center">
            <div class="col-md-6">
                <label class="form-label-tech">Search Category</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0" style="border-radius: 10px 0 0 10px; border-color: #cbd5e1;"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                    <input type="text" id="searchCategoryInput" class="form-control input-tech border-start-0 ps-0" style="border-radius: 0 10px 10px 0 !important;" placeholder="Enter category name to filter...">
                </div>
            </div>
        </div>
    </div>

    <div class="tech-card p-4">
        <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
            <h5 class="m-0 text-dark fw-bold"><i class="fa-solid fa-tags me-2 text-success"></i> Current Database</h5>
        </div>

        <div class="table-responsive" style="overflow-y: hidden;">
            <table class="table-tech" id="categoryTable">
                <thead>
                <tr>
                    <th style="width: 10%;">ID</th>
                    <th style="width: 45%;">Category Name</th>
                    <th style="width: 25%;">Total Movies</th>
                    <th class="text-end pe-4" style="width: 20%;">Actions</th>
                </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script th:src="@{/js/admin/admin-auth.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin/searchCategory.js?v=2}"></script>
</body>
</html>

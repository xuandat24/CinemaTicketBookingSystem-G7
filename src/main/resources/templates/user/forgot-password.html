<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{auth.login.forgot} + ' | CTBS Cinema'">Forgot Password | CTBS Cinema</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flag-icon-css/4.1.5/css/flag-icons.min.css"/>

    <style>
        .fade-in { animation: fadeIn 0.4s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .google-alert { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; padding: 15px; border-radius: 8px; font-size: 0.9rem; }
    </style>
</head>
<body class="login-body">
<div class="login-wrapper auth-wrapper">
    <div class="login-card">

        <div class="login-side-left d-none d-md-flex">
            <div class="login-slideshow">
                <div class="login-slide active" style="background-image: url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=2025')"></div>
                <div class="login-slideshow-overlay">
                    <h2 class="fw-bold text-white">CTBS MOVIE</h2>
                    <p class="text-white-50">Reset your password to continue</p>
                </div>
            </div>
        </div>

        <div class="login-side-right position-relative">

            <div class="dropdown" style="position: absolute; top: 30px; right: 30px; z-index: 999;">
                <button class="lang-btn-custom" type="button" data-bs-toggle="dropdown" aria-expanded="false" style="width: 42px; height: 42px; padding: 0; display: flex; align-items: center; justify-content: center;">
                    <span th:if="${#locale.language == 'vi'}" class="flag-icon flag-icon-vn fs-5"></span>
                    <span th:if="${#locale.language == 'ja'}" class="flag-icon flag-icon-jp fs-5"></span>
                    <span th:if="${#locale.language == 'ko'}" class="flag-icon flag-icon-kr fs-5"></span>
                    <span th:if="${#locale.language == 'zh'}" class="flag-icon flag-icon-cn fs-5"></span>
                    <span th:if="${#locale.language == 'my'}" class="flag-icon flag-icon-mm fs-5"></span>
                    <span th:if="${#locale.language == 'en' or #locale.language == null}" class="flag-icon flag-icon-gb fs-5"></span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end lang-ticket-menu">
                    <li><a class="dropdown-item fw-bold lang-ticket-item" th:href="@{''(lang='en')}"><span class="flag-icon flag-icon-gb me-2"></span> English <i class="fa fa-ticket hover-ticket-icon"></i></a></li>
                    <li><a class="dropdown-item fw-bold lang-ticket-item" th:href="@{''(lang='vi')}"><span class="flag-icon flag-icon-vn me-2"></span> Tiếng Việt <i class="fa fa-ticket hover-ticket-icon"></i></a></li>
                </ul>
            </div>

            <div class="mb-4 mt-4 pt-3">
                <a class="login-brand m-0 p-0 d-flex align-items-center" th:href="@{/}">
                    <i class="fa fa-ticket me-2"></i> <span>CTBS MOVIE</span>
                </a>
            </div>

            <div class="mb-4">
                <h2 class="fw-bold m-0">Reset Password</h2>
                <p class="text-muted small mt-1" id="stepDescription">Enter your email to receive a secure OTP code.</p>
            </div>

            <div id="alertBox" class="d-none mb-3"></div>

            <form id="step1Form" class="fade-in">
                <div class="mb-4">
                    <label class="form-label small fw-bold">Email Address</label>
                    <input type="email" id="emailInput" class="form-control form-control-lg shadow-none" placeholder="Enter your registered email" required>
                </div>

                <div class="google-alert mb-4">
                    <i class="fa fa-info-circle me-1"></i> If you registered via Google, you cannot change your password here. Please login with Google.
                </div>

                <button type="submit" id="btnSendOTP" class="btn btn-dark w-100 py-3 fw-bold rounded-pill" style="background-color: #d96c2c; border: none;">
                    SEND OTP CODE
                </button>

                <p class="text-center mt-4 small">
                    <a th:href="@{/login}" class="text-decoration-none text-muted fw-bold"><i class="fa fa-arrow-left me-1"></i> Back to Login</a>
                </p>
            </form>

            <form id="step2Form" class="d-none fade-in">
                <div class="mb-3">
                    <label class="form-label small fw-bold">Enter OTP Code</label>
                    <input type="text" id="otpInput" class="form-control form-control-lg shadow-none text-center tracking-widest fw-bold" placeholder="• • • • • •" required maxlength="6">
                    <div class="text-end mt-1"><a href="#" id="resendOtp" class="small text-decoration-none" style="color: #d96c2c;">Resend OTP</a></div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold">New Password</label>
                    <input type="password" id="newPassword" class="form-control form-control-lg shadow-none" placeholder="At least 8 characters" required>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-bold">Confirm New Password</label>
                    <input type="password" id="confirmPassword" class="form-control form-control-lg shadow-none" placeholder="Confirm new password" required>
                </div>

                <button type="submit" id="btnResetPass" class="btn btn-dark w-100 py-3 fw-bold rounded-pill" style="background-color: #d96c2c; border: none;">
                    RESET PASSWORD
                </button>
            </form>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const step1Form = document.getElementById('step1Form');
    const step2Form = document.getElementById('step2Form');
    const btnSendOTP = document.getElementById('btnSendOTP');
    const btnResetPass = document.getElementById('btnResetPass');
    const btnResendOtp = document.getElementById('resendOtp'); // Bắt ID của nút Gửi lại
    const alertBox = document.getElementById('alertBox');
    const stepDescription = document.getElementById('stepDescription');
    let userEmail = ''; // Lưu lại email ở bước 1 để dùng cho bước 2 và gửi lại

    function showAlert(msg, type) {
        alertBox.className = `alert alert-${type} small fw-bold mb-3 fade-in`;
        alertBox.innerHTML = `<i class="fa fa-${type === 'danger' ? 'exclamation-triangle' : 'check-circle'} me-2"></i>${msg}`;
        alertBox.classList.remove('d-none');
    }

    // ==========================================
    // BƯỚC 1: GỌI API GỬI OTP (/api/auth/forgot-password)
    // ==========================================
    step1Form.addEventListener('submit', async function (e) {
        e.preventDefault();
        userEmail = document.getElementById('emailInput').value.trim();
        if (!userEmail) return;

        btnSendOTP.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Sending...';
        btnSendOTP.disabled = true;
        alertBox.classList.add('d-none');

        try {
            const response = await fetch(`/api/auth/forgot-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: userEmail })
            });

            const data = await response.json();

            if (response.ok) {
                step1Form.classList.add('d-none');
                step2Form.classList.remove('d-none');
                stepDescription.innerText = `We sent a 6-digit code to ${userEmail}`;
                showAlert(data.message || "OTP sent successfully! Please check your email.", 'success');
            } else {
                showAlert(data.message || "Failed to send OTP.", 'danger');
            }
        } catch (error) {
            showAlert("Server connection error.", 'danger');
        } finally {
            btnSendOTP.innerHTML = 'SEND OTP CODE';
            btnSendOTP.disabled = false;
        }
    });

    // ==========================================
    // TÍNH NĂNG GỬI LẠI OTP (RESEND)
    // ==========================================
    if (btnResendOtp) {
        btnResendOtp.addEventListener('click', async function (e) {
            e.preventDefault(); // Ngăn trình duyệt cuộn lên đầu trang

            // Nếu không có email hoặc nút đang bị khóa đếm ngược thì không làm gì cả
            if (!userEmail || btnResendOtp.style.pointerEvents === 'none') return;

            btnResendOtp.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Sending...';
            btnResendOtp.style.pointerEvents = 'none'; // Khóa nút
            btnResendOtp.style.color = '#888';
            alertBox.classList.add('d-none');

            try {
                // Gọi lại đúng API gửi OTP như ở Bước 1
                const response = await fetch(`/api/auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail })
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert("A new OTP has been sent to your email.", 'success');

                    // Tạo bộ đếm ngược 60 giây
                    let countdown = 60;
                    const interval = setInterval(() => {
                        countdown--;
                        btnResendOtp.innerText = `Wait ${countdown}s`;
                        if (countdown <= 0) {
                            clearInterval(interval);
                            btnResendOtp.innerText = "Resend OTP";
                            btnResendOtp.style.pointerEvents = 'auto'; // Mở khóa nút
                            btnResendOtp.style.color = '#d96c2c';
                        }
                    }, 1000);

                } else {
                    showAlert(data.message || "Failed to resend OTP.", 'danger');
                    btnResendOtp.innerText = "Resend OTP";
                    btnResendOtp.style.pointerEvents = 'auto';
                    btnResendOtp.style.color = '#d96c2c';
                }
            } catch (error) {
                showAlert("Server connection error.", 'danger');
                btnResendOtp.innerText = "Resend OTP";
                btnResendOtp.style.pointerEvents = 'auto';
                btnResendOtp.style.color = '#d96c2c';
            }
        });
    }

    // ==========================================
    // BƯỚC 2: GỌI API ĐẶT LẠI MẬT KHẨU (/api/auth/reset-password)
    // ==========================================
    step2Form.addEventListener('submit', async function (e) {
        e.preventDefault();
        const otp = document.getElementById('otpInput').value.trim();
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (newPassword.length < 8) return showAlert("Password must be at least 8 characters.", 'danger');
        if (newPassword !== confirmPassword) return showAlert("Passwords do not match!", 'danger');

        btnResetPass.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Resetting...';
        btnResetPass.disabled = true;

        try {
            const response = await fetch('/api/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: userEmail, otp: otp, newPassword: newPassword })
            });

            const data = await response.json();

            if (response.ok) {
                step2Form.classList.add('d-none');
                stepDescription.classList.add('d-none');
                alertBox.className = 'alert alert-success text-center py-4 fade-in';
                alertBox.innerHTML = `
                    <i class="fa fa-check-circle fa-3x text-success mb-3"></i><br>
                    <h5 class="fw-bold">Success!</h5>
                    <p class="mb-0">${data.message || 'Your password has been changed.'}</p>
                    <p class="small text-muted mt-2">Redirecting to the login page...</p>
                `;
                setTimeout(() => { window.location.href = "/login"; }, 3000);
            } else {
                showAlert(data.message || "Invalid OTP code!", 'danger');
            }
        } catch (error) {
            showAlert("An error occurred, please try again.", 'danger');
        } finally {
            btnResetPass.innerHTML = 'RESET PASSWORD';
            btnResetPass.disabled = false;
        }
    });
</script>
</body>
</html>

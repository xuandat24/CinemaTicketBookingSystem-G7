<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Khôi phục mật khẩu | Movie Theme</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <style>
        /* Thêm một chút CSS riêng cho mượt mà */
        .fade-in { animation: fadeIn 0.4s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .google-alert { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; padding: 15px; border-radius: 8px; font-size: 0.9rem; }
    </style>
</head>
<body class="login-body">
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-side-left d-none d-md-flex">
            <div class="login-slideshow">
                <div class="login-slide active" style="background-image: url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=2025')"></div>
            </div>
            <div class="reg-overlay"></div>
            <div class="reg-content" style="z-index: 2; position: relative; padding: 40px;">
                <h1 class="text-white fw-bold">FORGOT<br>PASSWORD?</h1>
                <p class="text-white-50 mt-3">Đừng lo lắng, chúng tôi sẽ giúp bạn lấy lại quyền truy cập vào thế giới điện ảnh ngay bây giờ.</p>
            </div>
        </div>

        <div class="login-side-right" style="position: relative;">
            <a th:href="@{/login}" class="text-decoration-none text-muted small position-absolute top-0 end-0 mt-4 me-4">
                <i class="fa fa-arrow-left"></i> Back to Login
            </a>

            <div class="w-100 mt-5 pt-3">
                <h3 class="fw-bold mb-2">Khôi phục mật khẩu</h3>
                <p class="text-muted small mb-4" id="step-description">Vui lòng nhập địa chỉ email bạn đã đăng ký.</p>

                <div id="alert-box" class="mb-3 d-none"></div>

                <form id="step1-form" class="fade-in">
                    <div class="mb-4">
                        <label class="form-label small fw-bold">Địa chỉ Email</label>
                        <input type="email" id="email" class="form-control shadow-none" placeholder="example@gmail.com" required>
                    </div>
                    <button type="submit" id="btn-send-otp" class="login-btn-submit w-100 mb-3">
                        GỬI MÃ XÁC NHẬN
                    </button>
                </form>

                <form id="step2-form" class="d-none fade-in">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Mã OTP (6 số)</label>
                        <input type="text" id="otp" class="form-control shadow-none text-center fs-4 letter-spacing-2" placeholder="------" maxlength="6" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Mật khẩu mới</label>
                        <input type="password" id="newPassword" class="form-control shadow-none" placeholder="Nhập mật khẩu mới" required>
                        <small class="text-muted" style="font-size: 0.75rem;">Ít nhất 8 ký tự, gồm chữ hoa, chữ thường, số và ký tự đặc biệt.</small>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-bold">Xác nhận mật khẩu mới</label>
                        <input type="password" id="confirmPassword" class="form-control shadow-none" placeholder="Nhập lại mật khẩu mới" required>
                    </div>
                    <button type="submit" id="btn-reset-pass" class="login-btn-submit w-100 mb-3">
                        ĐẶT LẠI MẬT KHẨU
                    </button>
                </form>

            </div>
        </div>
    </div>
</div>

<script>
    // Các phần tử DOM
    const step1Form = document.getElementById('step1-form');
    const step2Form = document.getElementById('step2-form');
    const btnSendOtp = document.getElementById('btn-send-otp');
    const btnResetPass = document.getElementById('btn-reset-pass');
    const alertBox = document.getElementById('alert-box');
    const stepDescription = document.getElementById('step-description');

    let userEmail = "";

    // Hàm hiển thị thông báo
    function showAlert(message, type = 'danger') {
        alertBox.className = `alert alert-${type} small fade-in`;
        alertBox.innerHTML = message;
        alertBox.classList.remove('d-none');
    }

    // XỬ LÝ BƯỚC 1: GỬI EMAIL LẤY OTP
    step1Form.addEventListener('submit', async function(e) {
        e.preventDefault();
        userEmail = document.getElementById('email').value.trim();

        // Đổi trạng thái nút
        btnSendOtp.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Đang gửi...';
        btnSendOtp.disabled = true;
        alertBox.classList.add('d-none');

        try {
            const response = await fetch('/api/auth/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: userEmail })
            });

            const data = await response.json();

            if (response.ok) {
                // Thành công: Chuyển sang Bước 2
                step1Form.classList.add('d-none');
                step2Form.classList.remove('d-none');
                stepDescription.innerText = `Mã xác nhận gồm 6 chữ số đã được gửi tới ${userEmail}. Mã có hiệu lực trong 5 phút.`;
                showAlert(data.message, 'success');
            } else if (response.status === 409 && data.type === 'GOOGLE_ACCOUNT') {
                // Tài khoản Google
                alertBox.className = 'google-alert fade-in mb-4';
                alertBox.innerHTML = `
                    <strong><i class="fa fa-google"></i> Tài khoản liên kết Google</strong><br>
                    Email này được đăng nhập thông qua Google nên không có mật khẩu riêng trên hệ thống.<br>
                    <a href="https://myaccount.google.com/security" target="_blank" class="fw-bold text-dark mt-2 d-inline-block">
                        -> Quản lý tài khoản Google của bạn tại đây
                    </a>
                `;
                alertBox.classList.remove('d-none');
            } else {
                // Lỗi khác (Email không tồn tại...)
                showAlert(data.message || "Lỗi hệ thống!", 'danger');
            }
        } catch (error) {
            showAlert("Không thể kết nối đến máy chủ. Vui lòng thử lại sau.", 'danger');
        } finally {
            btnSendOtp.innerHTML = 'GỬI MÃ XÁC NHẬN';
            btnSendOtp.disabled = false;
        }
    });

    // XỬ LÝ BƯỚC 2: KIỂM TRA OTP & ĐỔI MẬT KHẨU
    step2Form.addEventListener('submit', async function(e) {
        e.preventDefault();
        const otp = document.getElementById('otp').value.trim();
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        // Validate cơ bản trên Frontend
        if (newPassword !== confirmPassword) {
            showAlert("Mật khẩu xác nhận không khớp!", 'danger');
            return;
        }

        const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/;
        if (!passwordRegex.test(newPassword)) {
            showAlert("Mật khẩu phải có ít nhất 8 ký tự, gồm chữ hoa, chữ thường, số và ký tự đặc biệt.", 'danger');
            return;
        }

        btnResetPass.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Đang xử lý...';
        btnResetPass.disabled = true;

        try {
            const response = await fetch('/api/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: userEmail,
                    otp: otp,
                    newPassword: newPassword
                })
            });

            const data = await response.json();

            if (response.ok) {
                // Đổi thành công, báo cho user và chuyển hướng về trang Login
                step2Form.classList.add('d-none');
                stepDescription.classList.add('d-none');
                alertBox.className = 'alert alert-success text-center py-4 fade-in';
                alertBox.innerHTML = `
                    <i class="fa fa-check-circle fa-3x text-success mb-3"></i><br>
                    <h5 class="fw-bold">Thành công!</h5>
                    <p class="mb-0">Mật khẩu của bạn đã được thay đổi.</p>
                    <p class="small text-muted mt-2">Đang chuyển hướng về trang đăng nhập...</p>
                `;

                setTimeout(() => {
                    window.location.href = "/login";
                }, 3000); // Chuyển trang sau 3 giây

            } else {
                showAlert(data.message || "Mã OTP không hợp lệ!", 'danger');
            }
        } catch (error) {
            showAlert("Đã xảy ra lỗi, vui lòng thử lại.", 'danger');
        } finally {
            btnResetPass.innerHTML = 'ĐẶT LẠI MẬT KHẨU';
            btnResetPass.disabled = false;
        }
    });
</script>
</body>
</html>

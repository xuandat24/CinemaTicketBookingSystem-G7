<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/blog.css}">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>

</head>

<body>

<div class="main_o main">
    <div class="main_o1 bg_back">

        <section id="header">
            <div th:replace="layout/navbar :: navbar"></div>
        </section>

        <section id="center" class="centre_o pt-5 pb-5">
            <div class="container-xl">
                <div class="row centre_o1 text-center">
                    <div class="col-md-12">
                        <h1 class="text-white font_60">Register</h1>
                    </div>
                </div>
            </div>
        </section>

    </div>
</div>

<section id="login" class="p_3">
    <div class="container-xl">
        <div class="row login_1">
            <div class="col-md-12">

                <div class="login_1m p-5 px-4 w-50 mx-auto bg-light">

                    <form id="registerForm">
                        <h6 class="mb-3 fw-bold">First Name</h6>
                        <input class="form-control" id="firstName" type="text">
                        <div id="error-firstName" class="text-danger small mt-1"></div>

                        <h6 class="mb-3 fw-bold mt-4">Last Name</h6>
                        <input class="form-control" id="lastName" type="text">
                        <div id="error-lastName" class="text-danger small mt-1"></div>

                        <h6 class="mb-3 fw-bold mt-4">Username</h6>
                        <input class="form-control" id="userName" type="text">
                        <div id="error-userName" class="text-danger small mt-1"></div>

                        <h6 class="mb-3 fw-bold mt-4">Phone Number</h6>
                        <input class="form-control" id="phone" type="text">
                        <div id="error-phone" class="text-danger small mt-1"></div>

                        <h6 class="mb-3 fw-bold mt-4">Email</h6>
                        <input class="form-control" id="email" type="email">
                        <div id="error-email" class="text-danger small mt-1"></div>

                        <h6 class="mb-3 fw-bold mt-4">Password</h6>
                        <input class="form-control" id="password" type="password">
                        <div id="error-password" class="text-danger small mt-1"></div>

                        <div id="errorMsg" class="text-danger fw-bold mt-3"></div>

                        <button class="button d-block text-center w-100 mt-4" type="submit">
                            Register
                        </button>
                    </form>

                        <div class="text-center mt-3">
                            <p class="mb-2 text-muted">Or</p>
                            <a th:href="@{/oauth2/authorization/google}" class="btn ...">
                                <i class="fa fa-google me-2"></i> Sign up with Google
                            </a>
                        </div>

                    </form>

                    <p class="mt-4 mb-0 text-center">
                        Already have an account?
                        <a class="fw-bold col_oran" th:href="@{/login}">Login</a>
                    </p>

                </div>

            </div>
        </div>
    </div>
</section>

<footer th:replace="layout/footer :: footer"></footer>

<script th:src="@{/js/auth.js}"></script>

</body>
</html>

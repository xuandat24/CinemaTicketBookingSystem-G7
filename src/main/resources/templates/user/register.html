<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Đăng ký | Movie Theme</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/css/global.css}">
</head>
<body class="reg-body">
<div class="reg-wrapper auth-wrapper">
    <div class="reg-card">
        <div class="reg-side-left d-none d-md-flex">
            <div class="reg-overlay"></div>
            <div class="reg-content">
                <div class="reg-badge">NEW MEMBER</div>
                <h1 class="text-white fw-bold">JOIN THE<br>COMMUNITY</h1>
                <p class="text-white-50 mt-3">Get your all-access pass to the best cinematic experience.</p>

                <div class="movie-ticket-animation">
                    <div class="ticket">
                        <i class="fa fa-ticket"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="reg-side-right">
            <a class="reg-brand" th:href="@{/}">
                <i class="fa fa-modx"></i> <span>MovieTheme</span>
            </a>

            <div class="reg-header mb-4">
                <h2 class="fw-bold m-0">Create Account</h2>
                <p class="text-muted small">Welcome new member CTBS</p>
            </div>

            <form id="registerForm">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label small fw-bold">First Name</label>
                        <input class="form-control" id="firstName" placeholder="VD: Đạt" type="text">
                        <div class="text-danger small mt-1 error-text fw-bold" id="firstNameError"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label small fw-bold">Last Name</label>
                        <input class="form-control" id="lastName" placeholder="VD: Xuân" type="text">
                        <div class="text-danger small mt-1 error-text fw-bold" id="lastNameError"></div>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-bold">UserName</label>
                    <input class="form-control" id="userName" placeholder="Nhập tên đăng nhập" type="text">
                    <div class="text-danger small mt-1 error-text fw-bold" id="userNameError"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold">Phone Number</label>
                    <input class="form-control" id="phoneNumber" placeholder="Số điện thoại" type="text">
                    <div class="text-danger small mt-1 error-text fw-bold" id="phoneError"></div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-bold">Email</label>
                    <input class="form-control" id="email" placeholder="Nhập email" type="email">
                    <div class="text-danger small mt-1 error-text fw-bold" id="emailError"></div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label small fw-bold">Gender</label>
                        <select class="form-control" id="gender">
                            <option value="">Chọn giới tính</option>
                            <option value="Nam">Nam</option>
                            <option value="Nữ">Nữ</option>
                            <option value="Khác">Khác</option>
                        </select>
                        <div class="text-danger small mt-1 error-text fw-bold" id="genderError"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label small fw-bold">Date of birth</label>
                        <input class="form-control" id="dob" type="date">
                        <div class="text-danger small mt-1 error-text fw-bold" id="dobError"></div>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-bold">Password</label>
                    <div style="position: relative;">
                        <input type="password" id="password" class="form-control shadow-none" placeholder="Tối thiểu 8 ký tự" style="padding-right: 40px;">
                        <i class="fa fa-eye-slash" id="toggleRegPassword"
                           style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #888; font-size: 18px; z-index: 10;"
                           title="Hiện/Ẩn mật khẩu"></i>
                    </div>
                    <div id="passwordError" class="text-danger small mt-1 error-text fw-bold"></div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-bold">Confirm Password</label>
                    <input class="form-control" id="confirmPassword" placeholder="Nhập lại mật khẩu" type="password">
                    <div class="text-danger small mt-1 error-text fw-bold" id="confirmPasswordError"></div>
                </div>

                <button class="reg-btn-submit w-100 mb-3" type="submit">GET STARTED</button>

                <div class="reg-divider"><span>OR</span></div>

                <a class="reg-btn-google w-100" th:href="@{/oauth2/authorization/google}">
                    <img alt="Google" src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png">
                    Sign up with Google
                </a>

                <p class="text-center mt-4 mb-0 small text-muted">
                    Already have an account?
                    <a class="fw-bold col_oran text-decoration-none" th:href="@{/login}">Log in here</a>
                </p>
            </form>
        </div>
    </div>
</div>

<footer th:replace="~{layout/footer :: footer}"></footer>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/auth.js}"></script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const oldForm = document.getElementById("registerForm");

        if (oldForm) {
            // TUYỆT CHIÊU: Nhân bản form để xóa bỏ mọi logic cũ đang bị kẹt trong file auth.js
            const registerForm = oldForm.cloneNode(true);
            oldForm.parentNode.replaceChild(registerForm, oldForm);

            // =====================================
            // HIỂN THỊ CON MẮT (ĐÃ MANG RA NGOÀI ĐỂ HOẠT ĐỘNG NGAY LẬP TỨC)
            // =====================================
            const toggleRegPassword = document.getElementById("toggleRegPassword");
            const regPassword = document.getElementById("password");

            if (toggleRegPassword && regPassword) {
                toggleRegPassword.addEventListener("click", function () {
                    // Đổi type từ password sang text và ngược lại
                    const type = regPassword.getAttribute("type") === "password" ? "text" : "password";
                    regPassword.setAttribute("type", type);

                    // Đổi icon mắt gạch chéo thành mắt mở
                    this.classList.toggle("fa-eye");
                    this.classList.toggle("fa-eye-slash");
                });
            }

            // =====================================
            // XỬ LÝ SUBMIT FORM
            // =====================================
            registerForm.addEventListener("submit", async function (e) {
                e.preventDefault();

                // 1. Dọn dẹp sạch sẽ toàn bộ lỗi cũ trước khi quét kiểm tra
                document.querySelectorAll('.error-text').forEach(el => el.innerText = '');
                let hasError = false;

                // Lấy dữ liệu an toàn
                const getVal = (id) => {
                    const el = document.getElementById(id);
                    return el ? el.value.trim() : "";
                };

                const firstName = getVal("firstName");
                const lastName = getVal("lastName");
                const userName = getVal("userName");
                const phone = getVal("phoneNumber");
                const email = getVal("email");
                const gender = getVal("gender");
                const dob = getVal("dob");
                const password = getVal("password");
                const confirmPassword = getVal("confirmPassword");

                // =====================================
                // 2. KIỂM TRA LỖI MỘT LOẠT (BATCH VALIDATION)
                // =====================================

                if (!firstName) {
                    document.getElementById("firstNameError").innerText = "Vui lòng nhập First Name!";
                    hasError = true;
                }
                if (!lastName) {
                    document.getElementById("lastNameError").innerText = "Vui lòng nhập Last Name!";
                    hasError = true;
                }
                if (!userName) {
                    document.getElementById("userNameError").innerText = "Vui lòng nhập UserName!";
                    hasError = true;
                }
                if (!email) {
                    document.getElementById("emailError").innerText = "Vui lòng nhập Email!";
                    hasError = true;
                }
                if (!gender) {
                    document.getElementById("genderError").innerText = "Vui lòng chọn giới tính!";
                    hasError = true;
                }

                if (!phone) {
                    document.getElementById("phoneError").innerText = "Vui lòng nhập Số điện thoại!";
                    hasError = true;
                } else if (!/^(03|09)\d{8}$/.test(phone)) {
                    document.getElementById("phoneError").innerText = "SĐT phải có 10 số, bắt đầu bằng 03 hoặc 09!";
                    hasError = true;
                }

                // KIỂM TRA NĂM SINH ĐỘC LẬP VÀ NGHIÊM NGẶT
                const dobErrorDiv = document.getElementById("dobError");
                if (!dob) {
                    if (dobErrorDiv) dobErrorDiv.innerText = "Vui lòng nhập Ngày Sinh!";
                    hasError = true;
                } else {
                    const yearStr = dob.split('-')[0];
                    const yearNum = parseInt(yearStr, 10);
                    const currentYear = new Date().getFullYear();

                    if (yearStr.length > 4) {
                        if (dobErrorDiv) dobErrorDiv.innerText = "Năm sinh không hợp lệ (Không được quá 4 chữ số)!";
                        hasError = true;
                    } else if (yearNum < 1900) {
                        if (dobErrorDiv) dobErrorDiv.innerText = "Năm sinh không tồn tại (Vui lòng nhập năm thật)!";
                        hasError = true;
                    } else if (yearNum > currentYear) {
                        if (dobErrorDiv) dobErrorDiv.innerText = "Năm sinh không được lớn hơn năm hiện tại!";
                        hasError = true;
                    }
                }

                // KIỂM TRA MẬT KHẨU
                if (!password) {
                    document.getElementById("passwordError").innerText = "Vui lòng nhập Mật khẩu!";
                    hasError = true;
                } else if (password.length < 8) {
                    document.getElementById("passwordError").innerText = "Mật khẩu phải chứa tối thiểu 8 ký tự!";
                    hasError = true;
                }

                if (password !== confirmPassword) {
                    document.getElementById("confirmPasswordError").innerText = "Mật khẩu nhập lại không khớp!";
                    hasError = true;
                }

                // Nếu có BẤT KỲ lỗi nào, dừng ngay lập tức (Báo đỏ một loạt)
                if (hasError) return;

                // 3. NẾU VƯỢ QUA ĐƯỢC TẤT CẢ, GỬI LÊN BACKEND
                const registerData = {
                    firstName: firstName,
                    lastName: lastName,
                    userName: userName,
                    phone: phone,
                    email: email,
                    gender: gender,
                    dob: dob,
                    password: password
                };

                try {
                    const res = await fetch("/api/auth/register", {
                        method: "POST",
                        headers: {"Content-Type": "application/json"},
                        body: JSON.stringify(registerData)
                    });

                    if (res.ok) {
                        alert("Đăng ký thành công! Vui lòng kiểm tra Email để xác nhận tài khoản.");
                        window.location.href = "/login";
                    } else {
                        const errorData = await res.json();

                        // 4. CHIA LỖI BACKEND VỀ ĐÚNG Ô TRÊN GIAO DIỆN
                        if (errorData.errors && errorData.errors.length > 0) {
                            errorData.errors.forEach(err => {
                                const errorElement = document.getElementById(err.field + "Error");
                                if (errorElement) {
                                    errorElement.innerText = err.defaultMessage;
                                }
                            });
                        } else if (errorData.message) {
                            alert("LỖI: " + errorData.message);
                        }
                    }
                } catch (error) {
                    alert("Lỗi kết nối đến máy chủ! Vui lòng kiểm tra lại mạng.");
                }
            });
        }
    });
</script>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Tickets</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        .tickets-wrap {
            background: #fff;
            border: 1px solid #eceff3;
            border-radius: 10px;
            overflow: hidden;
        }

        .tickets-head {
            padding: 18px 22px;
            border-bottom: 1px solid #eceff3;
            font-weight: 700;
            color: #0f172a;
        }

        .tickets-table {
            margin-bottom: 0;
        }

        .tickets-table thead th {
            font-size: 14px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            color: #334155;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            vertical-align: middle;
        }

        .tickets-table td {
            vertical-align: middle;
            color: #1f2937;
            font-size: 14px;
        }

        .film-title {
            font-weight: 700;
            color: #0f172a;
        }

        .muted-line {
            color: #64748b;
            font-size: 13px;
        }

        .status-pill {
            display: inline-block;
            padding: 3px 9px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            background: #ecfeff;
            color: #0c4a6e;
        }
    </style>
</head>
<body>
<div th:replace="~{layout/header :: header}"></div>

<div class="container mt-4 mb-5">
    <div class="tickets-wrap">
        <div class="tickets-head"><i class="fa fa-ticket me-2"></i>Booking History</div>

        <div th:if="${#lists.isEmpty(history)}" class="p-4 alert alert-info m-3">
            You do not have any booked tickets yet.
        </div>

        <table th:if="${!#lists.isEmpty(history)}" class="table tickets-table">
            <thead>
            <tr>
                <th>Film</th>
                <th>Room</th>
                <th>Show</th>
                <th>Seats</th>
                <th>Combo/Package</th>
                <th>Coupon</th>
                <th>Booked On Date</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="bill : ${history}">
                <td>
                    <div class="film-title" th:text="${bill.showtime != null && bill.showtime.movie != null ? bill.showtime.movie.title : 'N/A'}">Movie</div>
                    <div class="muted-line">
                        Code: <span th:text="${bill.bookingCode}">BC-XXXX</span>
                    </div>
                </td>
                <td th:text="${bill.showtime != null && bill.showtime.theaterRoom != null ? bill.showtime.theaterRoom.roomName : 'Room --'}">Theater Room 1</td>
                <td>
                    <div th:text="${bill.showtime != null && bill.showtime.startTime != null ? #temporals.format(bill.showtime.startTime, 'dd/MM/yyyy') : '-'}">26/03/2026</div>
                    <div class="muted-line" th:text="${bill.showtime != null && bill.showtime.startTime != null ? #temporals.format(bill.showtime.startTime, 'HH:mm') : '-'}">22:30</div>
                </td>
                <td>
                    <span th:if="${#lists.isEmpty(bill.bookingSeats)}">-</span>
                    <span th:each="bs, iter : ${bill.bookingSeats}"
                          th:text="${bs.seat != null ? bs.seat.seatCode : ''} + ${!iter.last ? ', ' : ''}">A1, A2</span>
                </td>
                <td>
                    <span th:if="${#lists.isEmpty(bill.bookingCombos)}">-</span>
                    <span th:each="bc, iter : ${bill.bookingCombos}"
                          th:text="${bc.combo != null ? bc.combo.name : 'Combo'} + ' x' + ${bc.quantity} + ${!iter.last ? ', ' : ''}">Popcorn x1</span>
                </td>
                <td th:text="${bill.couponCode != null and !#strings.isEmpty(bill.couponCode) ? bill.couponCode : (bill.coupon != null and bill.coupon.code != null ? bill.coupon.code : '-')}">-</td>
                <td>
                    <div th:text="${bill.createTime != null ? #temporals.format(bill.createTime, 'dd/MM/yyyy HH:mm') : '-'}">25/03/2026 17:52</div>
                    <span class="status-pill" th:text="${bill.status != null ? bill.status : 'PENDING'}">PENDING</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="layout/footer :: footer"></div>
</body>
</html>

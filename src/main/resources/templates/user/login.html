<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/blog.css}">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>

</head>

<body>

<div class="main_o main">
    <div class="main_o1 bg_back">

        <section id="header">
            <div th:replace="layout/navbar :: navbar"></div>
        </section>

        <section id="center" class="centre_o pt-5 pb-5">
            <div class="container-xl">
                <div class="row centre_o1 text-center">
                    <div class="col-md-12">
                        <h1 class="text-white font_60">Login</h1>
                    </div>
                </div>
            </div>
        </section>

    </div>
</div>

<section id="login" class="p_3">
    <div class="container-xl">
        <div class="row login_1">
            <div class="col-md-12">

                <div class="login_1m p-5 px-4 bg-light w-50 mx-auto">

                    <form th:action="@{/login}" method="post">

                        <h6 class="mb-3 fw-bold">Email</h6>
                        <input class="form-control" name="username" placeholder="Email" type="text">

                        <h6 class="mb-3 fw-bold mt-4">Password</h6>
                        <input class="form-control" name="password" placeholder="Password" type="password">

                        <div class="login_1mi row mt-3">

                            <div class="col-md-6 col-6">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" name="remember-me">
                                    <label class="form-check-label">Remember Me</label>
                                </div>
                            </div>

                            <div class="col-md-6 col-6 text-end">
                                <h6><a href="#">Forgot Password?</a></h6>
                            </div>

                        </div>

                        <button class="button_2 d-block text-center w-100 mt-3" type="submit">
                            LOGIN
                        </button>

                    </form>

                    <p class="mt-3 mb-0 text-center">
                        Don't have an account?
                        <a class="fw-bold a_tag" th:href="@{/register}">Create New Account</a>
                    </p>

                </div>

            </div>
        </div>
    </div>
    </div>
</section>

<footer th:replace="layout/footer :: footer"></footer>

</body>
</html>

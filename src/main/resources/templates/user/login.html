<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập | Movie Theme</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/css/global.css}">
</head>
<body class="login-body">
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-side-left">
            <div class="login-slideshow">
                <div class="login-slide active" style="background-image: url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=2070')"></div>
                <div class="login-slide" style="background-image: url('https://images.unsplash.com/photo-1478720568477-152d9b164e26?q=80&w=2070')"></div>
                <div class="login-slide" style="background-image: url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=2025')"></div>
                <div class="login-slideshow-overlay">
                    <h2 class="fw-bold text-white">MOVIE THEME</h2>
                    <p class="text-white-50">Unlimited movies, TV shows, and more</p>
                </div>
            </div>
        </div>

        <div class="login-side-right">
            <a th:href="@{/}" class="login-brand">
                <i class="fa fa-modx"></i> <span>MovieTheme</span>
            </a>

            <div class="mb-4 mt-5">
                <div class="d-flex align-items-center mb-1">
                    <h2 class="fw-bold m-0">Sign In</h2>
                    <div class="login-cute-camera ms-3">
                        <div class="login-cam-body">
                            <div class="login-cam-lens"></div>
                            <div class="login-cam-roll" style="left:0"></div>
                            <div class="login-cam-roll" style="left:12px"></div>
                        </div>
                    </div>
                </div>
                <p class="text-muted small">Welcome back! Please enter your details.</p>
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label small fw-bold">Username or Email</label>
                    <input type="text" id="username" class="form-control shadow-none" placeholder="Enter your email" required>
                </div>

                <div class="mb-3">
                    <div class="d-flex justify-content-between">
                        <label class="form-label small fw-bold">Password</label>
                        <a href="#" class="small text-decoration-none col_oran">Forgot password?</a>
                    </div>
                    <input type="password" id="password" class="form-control shadow-none" placeholder="••••••••" required>
                </div>

                <button type="submit" class="login-btn-submit w-100 mb-3">SIGN IN</button>

                <div class="login-divider"><span>OR</span></div>

                <a th:href="@{/oauth2/authorization/google}" class="login-btn-google w-100">
                    <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" alt="Google">
                    Sign in with Google
                </a>

                <p class="text-center mt-4 mb-0 small text-muted">
                    Don't have an account?
                    <a th:href="@{/register}" class="fw-bold text-dark text-decoration-none">Sign up for free</a>
                </p>
            </form>
        </div>
    </div>
</div>
<script>
    let current = 0;
    const slides = document.querySelectorAll('.login-slide');
    setInterval(() => {
        if(slides.length > 0) {
            slides[current].classList.remove('active');
            current = (current + 1) % slides.length;
            slides[current].classList.add('active');
        }
    }, 4000);
</script>
<footer th:replace="layout/footer :: footer"></footer>

<script th:src="@{/js/auth.js}"></script>
</body>
</html>>

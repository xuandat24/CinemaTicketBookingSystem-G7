        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">

            <ul class="navbar-nav mb-0 ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/about}">About Us</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link" th:href="@{/movies}">Movies</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdownBlogs" role="button" data-bs-toggle="dropdown" aria-expanded="false">Blogs</a>
                    <ul class="dropdown-menu drop_1" aria-labelledby="navbarDropdown">
                        <li><a class="dropdown-item" href="blog.html"><i class="fa fa-chevron-right font_12 me-1"></i> Blogs</a></li>
                        <li><a class="dropdown-item border-0" href="blog_detail.html"><i class="fa fa-chevron-right font_12 me-1"></i> Blog Details</a></li>
                    </ul>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdownFaqs" role="button" data-bs-toggle="dropdown" aria-expanded="false">Pages</a>
                    <ul class="dropdown-menu drop_1" aria-labelledby="navbarDropdown">
                        <li><a class="dropdown-item" href="faq.html"><i class="fa fa-chevron-right font_12 me-1"></i> Faqs</a></li>

            <ul class="navbar-nav">
                <li class="nav-item" id="nav-login">
                    <a class="nav-link" th:href="@{/login}">Login</a>
                </li>

                <li class="nav-item dropdown" id="nav-user" style="display: none;">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdownUser" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fa fa-user-circle"></i> <span id="display-username">User</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" th:href="@{/profile}">Profile</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="#" id="btn-logout">Logout</a></li>
                    </ul>
                </li>
            </ul>

            <script>
                // Hàm này sẽ chạy mỗi khi load trang để kiểm tra trạng thái đăng nhập
                function updateNavbar() {
                    const username = localStorage.getItem("username");
                    const navLogin = document.getElementById("nav-login");
                    const navUser = document.getElementById("nav-user");
                    const displayUsername = document.getElementById("display-username");

                    if (username) {
                        if (navLogin) navLogin.style.display = "none";
                        if (navUser) navUser.style.display = "block";
                        // Rút gọn tên nếu là email
                        const shortName = username.includes('@') ? username.split('@')[0] : username;
                        if (displayUsername) displayUsername.innerText = shortName;
                    } else {
                        if (navLogin) navLogin.style.display = "block";
                        if (navUser) navUser.style.display = "none";
                    }
                }

                document.addEventListener("DOMContentLoaded", function() {
                    // 1. Xử lý nhận Token từ Google Redirect (nếu có)
                    const urlParams = new URLSearchParams(window.location.search);
                    const token = urlParams.get('token');
                    const user = urlParams.get('username');

                    if (token && user) {
                        localStorage.setItem("jwtToken", token);
                        localStorage.setItem("username", user);
                        // Xóa param trên URL cho sạch
                        window.history.replaceState({}, document.title, window.location.pathname);
                    }

                    // 2. Cập nhật giao diện
                    updateNavbar();

                    // 3. Xử lý sự kiện Logout
                    const btnLogout = document.getElementById("btn-logout");
                    if (btnLogout) {
                        btnLogout.addEventListener("click", function(e) {
                            e.preventDefault();
                            if (confirm("Bạn có chắc chắn muốn đăng xuất?")) {
                                localStorage.removeItem("jwtToken");
                                localStorage.removeItem("username");
                                window.location.href = "/";
                            }
                        });
                    }
                });
            </script>
        </div>
    </div>

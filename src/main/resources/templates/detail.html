<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Movie Details - Movie Theme</title>

	<link th:href="@{/css/bootstrap.min.css}" rel="stylesheet" >
	<link th:href="@{/css/font-awesome.min.css}" rel="stylesheet" >
	<link th:href="@{/css/global.css}" rel="stylesheet">
	<link th:href="@{/css/list.css}" rel="stylesheet">
	<link th:href="@{/css/user/detail.css}" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Platypi:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

	<script th:src="@{/js/jquery-3.7.1.min.js}"></script>
	<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</head>
<body>

<div class="main_o main">
	<div class="main_o1 bg_back">

		<div th:replace="~{layout/navbar :: navbar}"></div>

		<section id="center" class="centre_o pt-5 pb-5">
			<div class="container-xl">
				<div class="row centre_o1 text-center">
					<div class="col-md-12">
						<h1 class="text-white font_60">Movie Details</h1>
						<h5 class="mb-0 mt-3 fw-normal col_oran">
							<a class="text-light" th:href="@{/}">Home</a>
							<span class="mx-2 text-muted">/</span> Movie Details
						</h5>
					</div>
				</div>
			</div>
		</section>
	</div>
</div>

<div class="border_dashed"></div>

<section id="detail" class="p_3">
	<div class="container-xl">
		<div class="row mb-3">
			<div class="col-12">
				<button onclick="goBack()" class="btn btn-outline-secondary fw-bold rounded-pill px-4">
					<i class="fa fa-arrow-left me-2"></i> Back to Movies
				</button>
			</div>
		</div>

		<div class="detail_1 row">
			<div class="col-md-6">
				<div class="detail_1l">
					<h2 id="movieTitle" class="fw-bold">Loading...</h2>
					<h6 class="mb-0 text-muted" id="movieMeta">... / ... Mins</h6>
				</div>
			</div>
			<div class="col-md-6">
				<div class="detail_1r text-end">
					<h6 class="mb-0"><a class="button_2" th:href="@{/ticket}" id="btnGetTicket">Get Ticket</a></h6>
				</div>
			</div>
		</div>

		<div class="detail_2 row mt-4">
			<div class="col-md-4">
				<div class="detail_2l">
					<div class="grid clearfix rounded overflow-hidden shadow">
						<figure class="effect-jazz mb-0">
							<img id="moviePoster" th:src="@{/img/placeholder.jpg}" class="w-100" style="height: 530px; object-fit: cover;" alt="Poster">
						</figure>
					</div>
				</div>
			</div>

			<div class="col-md-8">
				<div class="detail_2r position-relative rounded overflow-hidden shadow w-100" style="height: 530px; background-color: #000;">

					<div id="videoContainer" class="position-relative w-100 h-100 d-none">
						<video id="inlineVideo" playsinline class="w-100 h-100" style="object-fit: contain;">
							<source src="" type="video/mp4">
							Your browser does not support the video tag.
						</video>

						<div id="customPlayBtn" class="custom-play-btn">
							<i class="fa fa-play"></i>
						</div>
					</div>

					<div id="bannerContainer" class="w-100 h-100">
						<img id="movieBanner" th:src="@{/img/placeholder.jpg}" class="w-100 h-100" style="object-fit: cover;" alt="Banner">
					</div>

				</div>
			</div>
		</div>

		<div class="detail_3 row mt-4 bg-light p-4 rounded shadow-sm">
			<div class="col-md-4">
				<div class="detail_3l">
					<h6 class="mb-3 text-muted"><span class="fw-bold text-black me-2">Director:</span> <span id="movieDirector">N/A</span></h6>
					<h6 class="mb-3 text-muted"><span class="fw-bold text-black me-2">Rating:</span> <span id="movieRating" class="badge bg-warning text-dark fs-6">N/A</span> / 10</h6>
				</div>
			</div>
			<div class="col-md-8">
				<div class="detail_3l">
					<h6 class="mb-3 text-muted"><span class="fw-bold text-black me-2">Release Date:</span> <span id="movieRelease">N/A</span></h6>
					<h6 class="mb-3 text-muted"><span class="fw-bold text-black me-2">Cast:</span> <span id="movieActors" class="fst-italic">N/A</span></h6>
				</div>
			</div>
		</div>

		<hr>

		<div class="detail_4 row mt-4">
			<div class="col-md-12">
				<h3 class="fw-bold"><i class="fa fa-align-left col_oran me-2"></i> Description</h3>
				<p class="mt-3 fs-5 lh-lg text-secondary" id="movieDesc">No description available.</p>
			</div>
		</div>
	</div>
</section>

<div th:replace="~{layout/footer :: footer}"></div>

<<div class="modal fade" id="templateVideoModal" tabindex="-1" aria-labelledby="videoModalLabel" aria-hidden="true">
	<div class="modal-dialog modal-lg modal-dialog-centered">
		<div class="modal-content bg-transparent border-0">
			<div class="modal-header border-0 pb-0">
				<button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
			</div>
			<div class="modal-body p-0">
				<div class="ratio ratio-16x9 shadow-lg rounded overflow-hidden bg-black">
					<video id="localVideo" controls playsinline>
						<source src="" type="video/mp4">
						Your browser does not support the video tag.
					</video>
				</div>
			</div>
		</div>
	</div>
</div>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/detail.js}"></script>
</body>
</html>
